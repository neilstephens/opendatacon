{
	// ICCP Peer <-> Peer example: two ICCP ports in one opendatacon, both with the service role "Peer", talking over 127.0.0.1.
	// Each peer serves its own points (fed by its Sim port) AND reads the other's points (published to ODC), on the one association.
	//
	//   SimA --Connector1--> PeerA (ICCPClient: connects) ==(ICCP/TCP 127.0.0.1:10112)== PeerB (ICCPServer: listens) <--Connector2-- SimB
	//
	// The TCP direction only decides who initiates the association (the connecting side does); the configurations differ only in identity and
	// would work under either port type. Run from this directory:  opendatacon -p .
	//
	// Device control (TASE.2 Block 5): each peer owns a breaker (Serve) and operates the other's (Operate, Index 100). A control event sent to a peer
	// for Index 100 is operated on the other peer, which publishes it to its Sim port (Index 0). From the console, for example:
	//   spoof_event SimA PeerA {"EventType":"ControlRelayOutputBlock","Index":100,"SourcePort":"SimA","Payload":{"ControlCode":"LATCH_ON"}}
	//   spoof_event SimB PeerB {"EventType":"ControlRelayOutputBlock","Index":100,"SourcePort":"SimB","Payload":{"ControlCode":"LATCH_OFF"}}
	// Both directions can run at once on the one association.
	// All names and values are synthetic.
	"Version" : "ICCP Peer example 1.0",
	"LogName" : "ODC_ICCPPeer_Log",
	"LogFileSizekB" : 10000,
	"NumLogFiles" : 1,
	"LogLevel" : "debug",
	"ConsoleLevel" : "info",

	"Plugins" :
	[
		{
			"Name" : "ConsoleUI-1",
			"Type" : "ConsoleUI",
			"Library" : "ConsoleUI",
			"ConfFilename" : "",
			"ConfOverrides" : { }
		}
	],

	"Ports" :
	[
		{
			"Name" : "SimA",
			"Type" : "Sim",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"HttpIP" : "127.0.0.1",
				"HttpPort" : 9200,
				"BinaryControls" : [{"Index" : 0}],
				"Binaries" : [{"Index" : 0, "StartVal" : true, "UpdateIntervalms" : 4000}],
				"Analogs" : [{"Index" : 0, "StartVal" : 50, "UpdateIntervalms" : 1000, "StdDev" : 2}]
			}
		},
		{
			"Name" : "PeerA",
			"Type" : "ICCPClient",
			"Library" : "ICCPPort",
			"ConfFilename" : "PeerA.conf",
			"ConfOverrides" : { }
		},
		{
			"Name" : "PeerB",
			"Type" : "ICCPServer",
			"Library" : "ICCPPort",
			"ConfFilename" : "PeerB.conf",
			"ConfOverrides" : { }
		},
		{
			"Name" : "SimB",
			"Type" : "Sim",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"HttpIP" : "127.0.0.1",
				"HttpPort" : 9201,
				"BinaryControls" : [{"Index" : 0}],
				"Binaries" : [{"Index" : 0, "StartVal" : false, "UpdateIntervalms" : 6000}],
				"Analogs" : [{"Index" : 0, "StartVal" : 230, "UpdateIntervalms" : 2000, "StdDev" : 5}]
			}
		}
	],

	"Connectors" :
	[
		{
			"Name" : "Connector1",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"Connections" : [{"Name" : "Connection1", "Port1" : "SimA", "Port2" : "PeerA"}]
			}
		},
		{
			"Name" : "Connector2",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"Connections" : [{"Name" : "Connection2", "Port1" : "SimB", "Port2" : "PeerB"}]
			}
		}
	]
}
