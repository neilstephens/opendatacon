{
	// GoModbus-LuaPort-E2E example
	//
	// Tests the broadest possible surface of the ODC C-API by combining:
	//   GoModbusServer  – C-API port, TCP Modbus slave, exercises publish_event,
	//                     invoke_status_callback, get_config_json, log, ms_timer_callback
	//   GoModbusClient  – C-API port, TCP Modbus master, exercises same set plus cancel_timer
	//   DataGenerator   – LuaPort that drives the server's data store via periodic ODC events,
	//                     exercising ms_repeating_callback (msCoroutineLoop), ms_since_epoch,
	//                     get_working_dir, get_executable_dir
	//   DataSink        – LuaPort that consumes client-polled events, exercises in_demand,
	//                     should_log, ms_since_epoch_to_datetime, datetime_to_ms_since_epoch,
	//                     string2hex, hex2string, spawn_detached, spawn_attached, wait_pid,
	//                     kill_pid, event_type_to_string, command_status_to_string,
	//                     control_code_to_string, connect_state_to_string, quality_flags_to_string
	//
	// Run with: build/opendatacon -p ExampleConfig/GoModbus-LuaPort-E2E/
	//
	// Point layout (shared between client and server via shared_points.conf.json):
	//
	//   Direction       ODC idx  Modbus           DataType   Notes
	//   Gen → Srv → Cli
	//     Binary           0     Coil 0                      Toggle every 2 s
	//     BinaryOS        10     DI 0                        Status flag
	//     Analog           0     HR 0 (1 reg)    Int16       Ramp value
	//     Analog           1     HR 2 (2 reg)    Float32 ABCD  Counter
	//     Analog           2     HR 4 (2 reg)    Float32 DCBA  Exercises DCBA decode
	//     AnalogOS        10     IR 0 (1 reg)    Uint16      Free-running counter
	//     OctetString      0     HR 10 (8 reg)               Working-dir path bytes
	//   Sink → Cli → Srv (controls)
	//     BinaryControl   20     Coil 20                     CROB → coil write
	//     AnalogControl   20     HR 20 (1 reg)   AO16        Setpoint echo
	//     AnalogControl   21     HR 22 (2 reg)   AOF32       Float setpoint
	//     AnalogControl   22     HR 26 (4 reg)   AOD64       Double setpoint
	//   Srv → Sink (on Modbus client write)
	//     BinaryControl   20     Coil 20         → Binary(20) published by server
	//     AnalogControl   20-22  HR 20/22/26     → AO16/AOF32/AOD64 published by server
	//
	// C-API vtable coverage achieved:
	//   GoModbusPorts:  publish_event, invoke_status_callback, get_config_json, log,
	//                   ms_timer_callback, cancel_timer
	//   LuaPorts:       ms_repeating_callback (msCoroutineLoop), ms_since_epoch,
	//                   ms_since_epoch_to_datetime, datetime_to_ms_since_epoch,
	//                   string2hex, hex2string, get_working_dir, get_executable_dir,
	//                   spawn_detached, spawn_attached, wait_pid, kill_pid,
	//                   in_demand, should_log,
	//                   event_type_to_string, command_status_to_string,
	//                   control_code_to_string, connect_state_to_string,
	//                   quality_flags_to_string

	"LogName":     "ODC_Log",
	"LogFileSizekB": 5000,
	"NumLogFiles": 1,
	"LogLevel":    "debug",
	"ConsoleLevel": "info",

	"Plugins":
	[
		{
			"Name": "ConsoleUI-1",
			"Type": "ConsoleUI",
			"Library": "ConsoleUI",
			"ConfFilename": "",
			"ConfOverrides": {}
		},
		{
			"Name": "WebUI-1",
			"Type": "WebUI",
			"Library": "WebUI",
			"ConfFilename": "",
			"ConfOverrides": { "IP": "0.0.0.0", "Port": 10443 }
		}
	],

	"Ports":
	[
		// GoModbusServer: listens for Modbus TCP connections; ODC events from DataGenerator
		// update its data store; the GoModbusClient polls and reads those values.
		// Also publishes ODC events when the client writes controls (Coil 20, HR 20/22/26).
		{
			"Name": "ModbusServer",
			"Type": "GoModbusServer",
			"Library": "GoModbusPort",
			"ConfFilename": "server_device.conf.json",
			"ConfOverrides": {}
		},

		// GoModbusClient: polls ModbusServer every 2 s; publishes ODC events to DataSink.
		// Receives control events from DataSink and writes them to the server.
		{
			"Name": "ModbusClient",
			"Type": "GoModbusClient",
			"Library": "GoModbusPort",
			"ConfFilename": "client_device.conf.json",
			"ConfOverrides": {}
		},

		// DataGenerator: timer-driven LuaPort; publishes Binary, Analog (Int16 / Float32 ABCD /
		// Float32 DCBA), AnalogOutputStatus, BinaryOutputStatus, and OctetString events
		// to ModbusServer, which stores the values for the client to poll.
		// Exercises: ms_repeating_callback, ms_since_epoch, get_working_dir, get_executable_dir.
		{
			"Name": "DataGenerator",
			"Type": "Lua",
			"ConfFilename": "",
			"ConfOverrides":
			{
				"LuaFile": "DataGenerator.lua",
				"PeriodMs": 2000,
				"RampMax": 32767
			}
		},

		// DataSink: receives polled values from ModbusClient (via IndexShift transform) and
		// control-response events from ModbusServer.  Exercises every remaining host-API
		// function not covered by GoModbusPort itself.
		{
			"Name": "DataSink",
			"Type": "Lua",
			"ConfFilename": "",
			"ConfOverrides":
			{
				"LuaFile": "DataSink.lua",
				// Delay (ms) before sending control events to the client; must be
				// long enough for GoModbusClient to connect (initial delay ~1 s).
				"ControlDelayMs": 3000
			}
		}
	],

	"Connectors":
	[
		// DataGenerator → ModbusServer
		// The generator publishes all its ODC events into the server's data store.
		{
			"Name": "Gen2Server",
			"ConfFilename": "",
			"ConfOverrides":
			{
				"Connections":
				[
					{ "Name": "Gen_to_Srv", "Port1": "DataGenerator", "Port2": "ModbusServer" }
				]
			}
		},

		// ModbusClient → DataSink  (with index-shifting Lua transform)
		// Polled values from the client reach the sink with Analog indices shifted
		// by +1000 (so they're distinguishable from control-echo events at the sink).
		{
			"Name": "Client2Sink",
			"ConfFilename": "",
			"ConfOverrides":
			{
				"Connections":
				[
					{ "Name": "Cli_to_Sink", "Port1": "ModbusClient", "Port2": "DataSink" }
				],
				"Transforms":
				[
					{
						"Name": "IndexShift",
						"Type": "Lua",
						"Sender": "ModbusClient",
						"Parameters":
						{
							"LuaFile": "IndexShiftTransform.lua"
						}
					}
				]
			}
		},

		// ModbusServer → DataSink
		// Control-triggered events from the server (Coil-write Binary, HR-write AO*)
		// reach the sink directly so it can verify round-trip correctness.
		{
			"Name": "Server2Sink",
			"ConfFilename": "",
			"ConfOverrides":
			{
				"Connections":
				[
					{ "Name": "Srv_to_Sink", "Port1": "ModbusServer", "Port2": "DataSink" }
				]
			}
		},

		// DataSink → ModbusClient
		// The sink sends control events (CROB, AO16, AOF32, AOD64) to the client,
		// which writes them to the server's holding registers / coils.
		{
			"Name": "Sink2Client",
			"ConfFilename": "",
			"ConfOverrides":
			{
				"Connections":
				[
					{ "Name": "Sink_to_Cli", "Port1": "DataSink", "Port2": "ModbusClient" }
				]
			}
		}
	]
}
