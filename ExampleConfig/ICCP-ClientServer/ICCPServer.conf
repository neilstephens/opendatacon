{
	// ICCP (TASE.2) server port: listens for one association and serves the points below.
	// ODC Binary/Analog events from the connected port update the values; changes are reported by the
	// transfer set the client starts. All names and values are synthetic.
	// The ServiceRole is not given: an ICCPServer port defaults to "Server" (an ICCPClient port to "Client"). The configuration schema is the
	// same for every ICCP port; with an explicit "ServiceRole" and a "Direction" on the points this file would work under either port type.
	"IP" : "127.0.0.1",
	"Port" : "10102",

	// ---- addressing (hexadecimal selectors; AP-title is a dotted OID)
	"LocalTSelector" : "0001",  "RemoteTSelector" : "0002",
	"LocalSSelector" : "0001",  "RemoteSSelector" : "0002",
	"LocalPSelector" : "00000001",  "RemotePSelector" : "00000002",
	"LocalAPTitle" : "1.3.9999.1.1",  "LocalAEQualifier" : 1,
	"RemoteAPTitle" : "1.3.9999.1.2", "RemoteAEQualifier" : 2,

	// ---- TASE.2
	"TASE2Edition" : "2000-08",
	"BilateralTableID" : "BT_EXAMPLE_A",         // what this server reports when read
	"RemoteBilateralTableID" : "BT_EXAMPLE_B",   // what the client reports; a mismatch is logged
	"LocalDomain" : "DOMAIN_A",                  // the ICC domain this server's points live in
	"RemoteDomain" : "DOMAIN_B",                 // the client's domain (where its Bilateral_Table_ID is read)

	// ---- points: Index is the ODC index; Type is taken from here, it is not inferred
	"Binaries" : [{"Index" : 0, "Name" : "POINT_0001_ST", "Type" : "StateQ"},
		{"Index" : 1, "Name" : "POINT_0002_ST", "Type" : "StateQ"}],
	"Analogs" : [{"Index" : 0, "Name" : "POINT_0001_MW", "Type" : "RealQ"},
		{"Index" : 1, "Name" : "POINT_0002_MW", "Type" : "RealQ"}],

	// the pool of transfer sets this port offers to the client (Next_DSTransfer_Set)
	"TransferSetPool" : ["TS_POOL_001", "TS_POOL_002"],

	// ---- control devices this server owns (TASE.2 Block 5, device control; its support is advertised automatically).
	// The client operates them; each operate is published to ODC as a control event with the Index below (here to SimSource).
	// A device with "SelectRequired" true (the default) must be selected first (select before operate); the other takes a direct operate.
	// Names, indexes and values are synthetic.
	"BinaryControls" : [{"Index" : 0, "Name" : "DEVICE_0001_CMD", "SelectTimeoutms" : 10000},
		{"Index" : 1, "Name" : "DEVICE_0002_CMD", "SelectRequired" : false}],
	"AnalogControls" : [{"Index" : 0, "Name" : "DEVICE_0001_SP", "Type" : "RealSetpoint", "ScaleFactor" : 1.0, "Offset" : 0.0}]
}
