{
	"LogName" :	"ODC_Log",
	"LogFileSizekB"	: 50000,
	"NumLogFiles":	1,
	"LogLevel":	"info",
	"ConsoleLevel" : "info",

	//A Lua port that serves a status page and a REST endpoint (odc.HTTPServer) and polls a URL (odc.HTTPClient).
	//Run opendatacon in this directory, then open http://127.0.0.1:8080/ or http://127.0.0.1:8080/api/status
	//Nothing outside this machine is contacted: the script polls its own server unless you set PollURL.
	"Plugins" :
	[
		{
			"Name" : "ConsoleUI",
			"Type" : "ConsoleUI",
			"Library" : "ConsoleUI",
			"ConfFilename" : "",
			"ConfOverrides" : { }
		}
	],

	"Ports" :
	[
		{
			"Name" : "NetworkStatus",
			"Type" : "Lua",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"LuaFile" : "NetworkStatus.lua",
				"HttpPort" : 8080,
				//"PollURL" : "http://192.0.2.10:8000",
				"PollPath" : "/api/status",
				"PollPeriodSecs" : 5
			}
		},
		{
			"Name" : "Null",
			"Type" : "Null",
			"ConfFilename" : "",
			"ConfOverrides" :
			{}
		}
	],

	"Connectors" :
	[
		{
			"Name" : "Connector",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"Connections" :
				[
					{
						"Name" : "Connection",
						"Port1" : "NetworkStatus",
						"Port2" : "Null"
					}
				]
			}
		}
	]
}
