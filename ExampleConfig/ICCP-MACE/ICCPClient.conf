{
	// ICCP (TASE.2) client port with MACE authentication in the association: the TCP initiator is the association initiator.
	// Same as ../ICCP-ClientServer/ICCPClient.conf, plus the "MACE" section. All names and values are synthetic.
	"IP" : "127.0.0.1",
	"Port" : 10102,
	"TCPConnectRetryPeriodms" : 2000,

	// ---- MACE: this client authenticates in its association request (certificate and a signature of the current UTC time) and,
	// with RequireResponderAuthentication (the default), requires the server to authenticate in its response too.
	"MACE" :
	{
		"Enabled" : true,
		// OPTIONAL: the authentication mechanism-name we send. The default is the one IEC 62351-4 defines, 1.0.62351.4.3.1, and a peer's
		// own value is accepted whatever it is. Set it (e.g. "1.0.840.0.1.0.1.1") only for a peer that uses another value; that gives a warning.
		// "MechanismName" : "1.0.62351.4.3.1",
		"CertFile" : "certs/iccp-client.crt",
		"KeyFile" : "certs/iccp-client.key",
		"CAFile" : "certs/ca.crt",
		"PeerCertAllowList" : ["CN:iccp-server.example"],
		"TimeWindowSeconds" : 600
	},

	// ---- addressing: the mirror image of the server's
	"LocalTSelector" : "0002",  "RemoteTSelector" : "0001",
	"LocalSSelector" : "0002",  "RemoteSSelector" : "0001",
	"LocalPSelector" : "00000002",  "RemotePSelector" : "00000001",
	"LocalAPTitle" : "1.3.9999.1.2",  "LocalAEQualifier" : 2,
	"RemoteAPTitle" : "1.3.9999.1.1", "RemoteAEQualifier" : 1,

	// ---- TASE.2
	"TASE2Edition" : "2000-08",
	"BilateralTableID" : "BT_EXAMPLE_B",
	"RemoteBilateralTableID" : "BT_EXAMPLE_A",
	"LocalDomain" : "DOMAIN_B",
	"RemoteDomain" : "DOMAIN_A",

	// ---- points (the same names and types as the server's)
	"Binaries" : [{"Index" : 0, "Name" : "POINT_0001_ST", "Type" : "StateQ"},
		{"Index" : 1, "Name" : "POINT_0002_ST", "Type" : "StateQ"}],
	"Analogs" : [{"Index" : 0, "Name" : "POINT_0001_MW", "Type" : "RealQ"},
		{"Index" : 1, "Name" : "POINT_0002_MW", "Type" : "RealQ", "ScaleFactor" : 1.0, "Offset" : 0.0}],

	"DataSets" : [{"Name" : "DS_EXAMPLE_001", "Members" : ["POINT_0001_ST", "POINT_0002_ST", "POINT_0001_MW", "POINT_0002_MW"]}],
	"TransferSets" : [{"DataSet" : "DS_EXAMPLE_001", "Conditions" : ["ObjectChange", "IntegrityTimeOut"],
		"IntegrityCheck" : 20, "BufferTime" : 1}]
}
