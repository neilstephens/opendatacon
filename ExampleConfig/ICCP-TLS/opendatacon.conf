{
	// Secure ICCP (TLS, IEC 62351-3) loopback example: the ICCP-ClientServer example with TLS on the TCP connection.
	//
	//   SimSource --Connector1--> ICCPServer ==(ICCP over TLS, 127.0.0.1:3782)==> ICCPClient --Connector2--> SimSink
	//
	// 1. This needs opendatacon built with OpenSSL (-DODC_ASIO_SSL=ON), see the ICCPPort README, "Secure ICCP / TLS".
	// 2. The certificates are NOT part of the repository. Make throw-away ones first (needs the openssl command line tool):
	//        ./make-certs.sh        or        powershell -File make-certs.ps1
	//    They go in ./certs. For real use, certificates come from your own PKI.
	// 3. Run from this directory:  opendatacon -p .
	// All names and values are synthetic.
	"Version" : "ICCP TLS loopback example 1.0",
	"LogName" : "ODC_ICCP_TLS_Log",
	"LogFileSizekB" : 10000,
	"NumLogFiles" : 1,
	"LogLevel" : "debug",
	"ConsoleLevel" : "info",

	"Plugins" :
	[
		{
			"Name" : "ConsoleUI-1",
			"Type" : "ConsoleUI",
			"Library" : "ConsoleUI",
			"ConfFilename" : "",
			"ConfOverrides" : { }
		}
	],

	"Ports" :
	[
		{
			"Name" : "SimSource",
			"Type" : "Sim",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"HttpIP" : "127.0.0.1",
				"HttpPort" : 9100,
				"Binaries" : [{"Index" : 0, "StartVal" : true, "UpdateIntervalms" : 4000}, {"Index" : 1, "StartVal" : false, "UpdateIntervalms" : 6000}],
				"Analogs" : [{"Index" : 0, "StartVal" : 50, "UpdateIntervalms" : 1000, "StdDev" : 2},
					{"Index" : 1, "StartVal" : 230, "UpdateIntervalms" : 2000, "StdDev" : 5}]
			}
		},
		{
			"Name" : "ICCPServer",
			"Type" : "ICCPServer",
			"Library" : "ICCPPort",
			"ConfFilename" : "ICCPServer.conf",
			"ConfOverrides" : { }
		},
		{
			"Name" : "ICCPClient",
			"Type" : "ICCPClient",
			"Library" : "ICCPPort",
			"ConfFilename" : "ICCPClient.conf",
			"ConfOverrides" : { }
		},
		{
			"Name" : "SimSink",
			"Type" : "Sim",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"HttpIP" : "127.0.0.1",
				"HttpPort" : 9101,
				"Binaries" : [{"Index" : 0}, {"Index" : 1}],
				"Analogs" : [{"Index" : 0}, {"Index" : 1}]
			}
		}
	],

	"Connectors" :
	[
		{
			"Name" : "Connector1",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"Connections" : [{"Name" : "Connection1", "Port1" : "SimSource", "Port2" : "ICCPServer"}]
			}
		},
		{
			"Name" : "Connector2",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"Connections" : [{"Name" : "Connection2", "Port1" : "ICCPClient", "Port2" : "SimSink"}]
			}
		}
	]
}
