{
	// ICCP loopback example: a Sim port produces values, an ICCP server port serves them, an ICCP client port
	// (in the same opendatacon) associates with it over 127.0.0.1, reads the values with a transfer set and
	// hands them to a second Sim port that stands in for a downstream consumer.
	//
	//   SimSource --Connector1--> ICCPServer ==(ICCP/TCP 127.0.0.1:10102)==> ICCPClient --Connector2--> SimSink
	//
	// Run from this directory:  opendatacon -p .
	//
	// Device control (TASE.2 Block 5): a control event sent to ICCPClient is operated on the ICCP server, which publishes it as a control event
	// to SimSource (its BinaryControls). From the console, for example:
	//   spoof_event SimSink ICCPClient {"EventType":"ControlRelayOutputBlock","Index":0,"SourcePort":"SimSink","Payload":{"ControlCode":"LATCH_ON"}}
	// The result is the ODC command status (SUCCESS). SimSource has no analog outputs: a setpoint, for example
	//   spoof_event SimSink ICCPClient {"EventType":"AnalogOutputDouble64","Index":0,"SourcePort":"SimSink","Payload":{"Value":12.5,"CommandStatus":"SUCCESS"}}
	// is selected and operated on the server, which publishes it, and is answered NOT_SUPPORTED by SimSource (the ICCP logs show it). To see what
	// SimSource received:  http://127.0.0.1:9100/SimSource?type=control&index=0,1
	// All names and values are synthetic.
	"Version" : "ICCP loopback example 1.0",
	"LogName" : "ODC_ICCP_Log",
	"LogFileSizekB" : 10000,
	"NumLogFiles" : 1,
	"LogLevel" : "debug",
	"ConsoleLevel" : "info",

	"Plugins" :
	[
		{
			"Name" : "ConsoleUI-1",
			"Type" : "ConsoleUI",
			"Library" : "ConsoleUI",
			"ConfFilename" : "",
			"ConfOverrides" : { }
		}
	],

	"Ports" :
	[
		{
			"Name" : "SimSource",
			"Type" : "Sim",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"HttpIP" : "127.0.0.1",
				"HttpPort" : 9100,
				"BinaryControls" : [{"Index" : 0}, {"Index" : 1}],
				"Binaries" : [{"Index" : 0, "StartVal" : true, "UpdateIntervalms" : 4000}, {"Index" : 1, "StartVal" : false, "UpdateIntervalms" : 6000}],
				"Analogs" : [{"Index" : 0, "StartVal" : 50, "UpdateIntervalms" : 1000, "StdDev" : 2},
					{"Index" : 1, "StartVal" : 230, "UpdateIntervalms" : 2000, "StdDev" : 5}]
			}
		},
		{
			"Name" : "ICCPServer",
			"Type" : "ICCPServer",
			"Library" : "ICCPPort",
			"ConfFilename" : "ICCPServer.conf",
			"ConfOverrides" : { }
		},
		{
			"Name" : "ICCPClient",
			"Type" : "ICCPClient",
			"Library" : "ICCPPort",
			"ConfFilename" : "ICCPClient.conf",
			"ConfOverrides" : { }
		},
		{
			"Name" : "SimSink",
			"Type" : "Sim",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"HttpIP" : "127.0.0.1",
				"HttpPort" : 9101,
				"Binaries" : [{"Index" : 0}, {"Index" : 1}],
				"Analogs" : [{"Index" : 0}, {"Index" : 1}]
			}
		}
	],

	"Connectors" :
	[
		{
			"Name" : "Connector1",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"Connections" : [{"Name" : "Connection1", "Port1" : "SimSource", "Port2" : "ICCPServer"}]
			}
		},
		{
			"Name" : "Connector2",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"Connections" : [{"Name" : "Connection2", "Port1" : "ICCPClient", "Port2" : "SimSink"}]
			}
		}
	]
}
