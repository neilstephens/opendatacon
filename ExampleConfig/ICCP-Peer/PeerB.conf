{
	// ICCP Peer B. Its port type (ICCPServer in opendatacon.conf) makes it listen for the TCP connection; everything else is the same as for
	// a connecting port, and the association is initiated by the peer that connects. "Local" is this port, "Remote" the peer.
	// All names and values are synthetic.
	"ServiceRole" : "Peer",
	"IP" : "127.0.0.1",
	"Port" : "10112",

	"LocalTSelector" : "0002",  "RemoteTSelector" : "0001",
	"LocalSSelector" : "0002",  "RemoteSSelector" : "0001",
	"LocalPSelector" : "00000002",  "RemotePSelector" : "00000001",
	"LocalAPTitle" : "1.3.9999.1.2",  "LocalAEQualifier" : 2,
	"RemoteAPTitle" : "1.3.9999.1.1", "RemoteAEQualifier" : 1,

	"TASE2Edition" : "2000-08",
	"BilateralTableID" : "BT_EXAMPLE_B",
	"RemoteBilateralTableID" : "BT_EXAMPLE_A",
	"LocalDomain" : "DOMAIN_B",
	"RemoteDomain" : "DOMAIN_A",

	"Binaries" : [{"Index" : 0, "Name" : "B_STATE", "Type" : "StateQ", "Direction" : "Serve"},
		{"Index" : 100, "Name" : "A_STATE", "Type" : "StateQ", "Direction" : "Read"}],
	"Analogs" : [{"Index" : 0, "Name" : "B_MW", "Type" : "RealQ", "Direction" : "Serve"},
		{"Index" : 100, "Name" : "A_MW", "Type" : "RealQ", "Direction" : "Read"}],

	"DataSets" : [{"Name" : "DS_A_001", "Members" : ["A_STATE", "A_MW"]}],
	"TransferSets" : [{"DataSet" : "DS_A_001", "Conditions" : ["ObjectChange", "IntegrityTimeOut"], "IntegrityCheck" : 20}],

	"TransferSetPool" : ["TS_B_1", "TS_B_2"],

	"BinaryControls" : [{"Index" : 0, "Name" : "B_BREAKER", "Direction" : "Serve"},
		{"Index" : 100, "Name" : "A_BREAKER", "Direction" : "Operate"}]
}
