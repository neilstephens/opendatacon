{
	// ICCP (TASE.2) server port with MACE authentication in the association: the TCP listener is the association responder.
	// Same as ../ICCP-ClientServer/ICCPServer.conf, plus the "MACE" section. All names and values are synthetic.
	"IP" : "127.0.0.1",
	"Port" : 10102,

	// ---- MACE: the client must authenticate in its association request (RequireAuthentication, the default), and this server
	// authenticates in its response with its own certificate. Make the certificates first with make-certs.sh / make-certs.ps1.
	// Relative paths are relative to the directory opendatacon runs in.
	"MACE" :
	{
		"Enabled" : true,
		// OPTIONAL: the authentication mechanism-name we send. The default is the one IEC 62351-4 defines, 1.0.62351.4.3.1, and a peer's
		// own value is accepted whatever it is. Set it (e.g. "1.0.840.0.1.0.1.1") only for a peer that uses another value; that gives a warning.
		// "MechanismName" : "1.0.62351.4.3.1",
		"CertFile" : "certs/iccp-server.crt",
		"KeyFile" : "certs/iccp-server.key",
		// "KeyPasswordEnv" : "ICCP_SERVER_KEY_PASSWORD",   // the NAME of an environment variable holding the key's password (never the password)
		// the trust anchors for the peer's certificate (only the peer's own certificate is sent: intermediate CAs belong in this file too)
		"CAFile" : "certs/ca.crt",
		// "CRLFile" : "certs/ca.crl",                      // revocation checking, fail-closed
		// only this peer is accepted (the CA may have issued other certificates): CN:, SAN: or SHA256:<fingerprint>
		"PeerCertAllowList" : ["CN:iccp-client.example"],
		// the peer's signing time must be within this many seconds of our UTC clock
		"TimeWindowSeconds" : 600
	},

	// ---- addressing (hexadecimal selectors; AP-title is a dotted OID)
	"LocalTSelector" : "0001",  "RemoteTSelector" : "0002",
	"LocalSSelector" : "0001",  "RemoteSSelector" : "0002",
	"LocalPSelector" : "00000001",  "RemotePSelector" : "00000002",
	"LocalAPTitle" : "1.3.9999.1.1",  "LocalAEQualifier" : 1,
	"RemoteAPTitle" : "1.3.9999.1.2", "RemoteAEQualifier" : 2,

	// ---- TASE.2
	"TASE2Edition" : "2000-08",
	"BilateralTableID" : "BT_EXAMPLE_A",
	"RemoteBilateralTableID" : "BT_EXAMPLE_B",
	"LocalDomain" : "DOMAIN_A",
	"RemoteDomain" : "DOMAIN_B",

	// ---- points
	"Binaries" : [{"Index" : 0, "Name" : "POINT_0001_ST", "Type" : "StateQ"},
		{"Index" : 1, "Name" : "POINT_0002_ST", "Type" : "StateQ"}],
	"Analogs" : [{"Index" : 0, "Name" : "POINT_0001_MW", "Type" : "RealQ"},
		{"Index" : 1, "Name" : "POINT_0002_MW", "Type" : "RealQ"}],

	"TransferSetPool" : ["TS_POOL_001", "TS_POOL_002"]
}
