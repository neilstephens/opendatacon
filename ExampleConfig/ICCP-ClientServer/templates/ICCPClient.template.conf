{
	// ICCP client port TEMPLATE. Replace every <PLACEHOLDER>; remove options you do not need. See ../../../Code/Ports/ICCPPort/README.md.
	// Not loadable until the placeholders are replaced.
	// "ServiceRole" (Client, Server or Peer) is independent of the port type; ICCPClient defaults to "Client" (its points are read from the peer).
	"IP" : "<SERVER_IP_ADDRESS>",
	"Port" : "102",                              // the server's TCP port (RFC 1006 uses 102)
	"TCPConnectRetryPeriodms" : 0,               // 0 = exponential back-off

	// ---- addressing: hexadecimal selectors, dotted-OID AP-titles. "Local" is this client, "Remote" the server.
	"LocalTSelector" : "<HEX>",   "RemoteTSelector" : "<HEX>",
	"LocalSSelector" : "<HEX>",   "RemoteSSelector" : "<HEX>",
	"LocalPSelector" : "<HEX>",   "RemotePSelector" : "<HEX>",
	"LocalAPTitle" : "<OID>",     "LocalAEQualifier" : 0,
	"RemoteAPTitle" : "<OID>",    "RemoteAEQualifier" : 0,
	"TPDUSize" : 1024,

	// ---- TASE.2
	"TASE2Edition" : "2000-08",                  // or "1996-08"
	"BilateralTableID" : "<OUR_BILATERAL_TABLE_ID>",
	"RemoteBilateralTableID" : "<THEIR_BILATERAL_TABLE_ID>",
	"LocalDomain" : "<OUR_DOMAIN_NAME>",
	"RemoteDomain" : "<THEIR_DOMAIN_NAME>",
	"SupportedBlocks" : [1, 2],
	"RequiredRemoteBlocks" : [1, 2, 5],          // 5 = device control (needed to operate the server's controls below; remove it if there are none)

	// ---- timers
	"RequestTimeoutms" : 5000,
	"AssociateTimeoutms" : 10000,
	"ReleaseTimeoutms" : 5000,

	// ---- points. Type must be given: Real, RealQ, RealQTimeTag, RealExtended (Analogs);
	// State, StateQ, StateQTimeTag, StateExtended (Binaries); Discrete, DiscreteQ, DiscreteQTimeTag, DiscreteExtended (Counters, Analogs)
	"Binaries" : [{"Index" : 0, "Name" : "<POINT_NAME>", "Type" : "StateQ", "Scope" : "ICC"}],
	"Analogs"  : [{"Index" : 0, "Name" : "<POINT_NAME>", "Type" : "RealQ", "ScaleFactor" : 1.0, "Offset" : 0.0}],
	"Counters" : [{"Index" : 0, "Name" : "<POINT_NAME>", "Type" : "DiscreteQ"}],

	// ---- data sets (defined on the server) and the transfer sets that report them
	"DataSets" : [{"Name" : "<DATA_SET_NAME>", "Members" : ["<POINT_NAME>"] /*, "PollIntervalms" : 10000 (poll instead of report) */}],
	"TransferSets" : [{"DataSet" : "<DATA_SET_NAME>",
		/* "Name" : "<FIXED_TRANSFER_SET_NAME>",  omit to ask the server for a free one (Next_DSTransfer_Set) */
		"Conditions" : ["ObjectChange", "IntegrityTimeOut"],
		"IntegrityCheck" : 60, "Interval" : 0, "BufferTime" : 0, "TLE" : 0, "StartTime" : 0,
		"RBE" : false, "BlockData" : false,
		// true: the server's reports are critical, and this client acknowledges each one (Transfer_Report_ACK); give "SpecialObjects" a Transfer_Set_Time_Stamp then
		// (e.g. ["Transfer_Set_Name", "Transfer_Set_Time_Stamp", "DSConditions_Detected"]) so that the acknowledgement has the report's time stamp to echo
		"Critical" : false,
		// the server's limit on how long a report may take to be sent, in seconds (0 = none): a late report is discarded by the server
		// ("TLE" above), and AcknowledgeCriticalReports / NackUnknownReports (top level) switch this client's acknowledgements off
		// true only with TASE2Edition 2000-08, "RBE" true, the ObjectChange condition and a "BufferTime" above 0 (otherwise a peer refuses the transfer set)
		"AllChangesReported" : false}],

	// ---- control devices of the server that this client operates (TASE.2 Block 5, device control; ServiceRole "Client" means Direction "Operate").
	// An ODC control event with the Index (ControlRelayOutputBlock for BinaryControls, AnalogOutput* for AnalogControls) becomes a select + operate
	// ("SelectRequired" true: a Read of the device's select object, then a Write of the value) or a direct operate (the Write alone) on the server's device;
	// the result goes back as the ODC command status. "CheckBackID" is optional: the value the select must return (the bilateral table's value for the
	// device); if the server returns another one the operate is not sent. Without it any value is accepted.
	// "CommandValueOn" / "CommandValueOff" are the device's integers for ON / OFF; "ScaleFactor" / "Offset" are for setpoints (ODC = TASE.2 * scale + offset).
	"BinaryControls" : [{"Index" : 0, "Name" : "<DEVICE_NAME>", "Type" : "Command", "SelectRequired" : true, "CheckBackID" : 1,
			"Timeoutms" : 15000, "CommandValueOn" : 1, "CommandValueOff" : 0}],
	"AnalogControls" : [{"Index" : 0, "Name" : "<DEVICE_NAME>", "Type" : "RealSetpoint", "ScaleFactor" : 1.0, "Offset" : 0.0}]
}
