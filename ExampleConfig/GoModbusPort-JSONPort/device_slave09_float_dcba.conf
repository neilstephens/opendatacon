{
	// Slave 9 — 32-bit IEEE 754 float, byte order D C B A (fully little-endian)
	// Holding Registers (HR): address range 1,3,5,…,1023 (two consecutive registers per value, 4 bytes)
	//
	// DCBA wire layout (for a float value with bytes A=MSByte, B, C, D=LSByte):
	//   reg[0] (lower address) carries byte D in the high-byte position, byte C in the low-byte position
	//   reg[1] (upper address) carries byte B in the high-byte position, byte A in the low-byte position
	// Decoding: byteSwap(reg[1]) << 16 | byteSwap(reg[0]) → ABCD → Float32

	"TCP": {
		"Address": "45.8.248.56:502"
	},
	"UnitID": 9,
	"TimeoutMs": 5000,
	"PollRateMs": 1000,

	// Three float analog values from HR addresses 1,3,5 (each uses 2 registers)
	"Analogs": [
		{ "Index": 1900, "Modbus": { "Type": "HoldingRegister", "Address": 1, "Count": 2 },
		  "Endian": "DCBA", "DataType": "Float32", "Scale": 1.0, "Offset": 0.0, "PollRateMs": 2000 },
		{ "Index": 1901, "Modbus": { "Type": "HoldingRegister", "Address": 3, "Count": 2 },
		  "Endian": "DCBA", "DataType": "Float32", "Scale": 1.0, "Offset": 0.0, "PollRateMs": 2000 },
		{ "Index": 1902, "Modbus": { "Type": "HoldingRegister", "Address": 5, "Count": 2 },
		  "Endian": "DCBA", "DataType": "Float32", "Scale": 1.0, "Offset": 0.0, "PollRateMs": 2000 }
	]
}
