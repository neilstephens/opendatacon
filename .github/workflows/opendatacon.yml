name: opendatacon workflow

on:
  push:
    branches:
      - '**' # matches every branch
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - '**'

env:
  LOG_LVL: ${{ secrets.ACTIONS_STEP_DEBUG == 'true' && 'debug' || 'error' }}

jobs:
  # opendatacon-dockerfile-builds job disabled entirely for this throw-away experiment branch

  opendatacon-native:
    name: ${{matrix.os}} ${{matrix.build-type}} ${{matrix.bits}} 
  
    strategy:
      fail-fast: false

      # THROW-AWAY EXPERIMENT BRANCH: trimmed to just the two configs that
      # reproduce the DNP3Port_tests flake (Win64/Win32 Debug), to iterate fast.
      matrix:
        os: [windows-latest]
        build-type: [Debug]
        bits: [64]
            
        include:
          - os: windows-latest
            build-type: Debug
            bits: 32
            cross: 'none'

    runs-on: ${{ matrix.os }}

    env:
      BUILD_TYPE: ${{ matrix.build-type }}
      INSTALL_PREFIX: ${{github.workspace}}/build/install
      JOB_NAME: ${{matrix.os}}_${{matrix.build-type}}_${{matrix.bits}}
      SCCACHE_GHA_ENABLED: "true"

    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - run: git fetch --force --tags
    
    - if: matrix.bits == 32 && contains(matrix.os,'windows')
      name: Set 32-bit env
      run: |
        echo 'BITPLAT=x86' >> $env:GITHUB_ENV
        $opensslHashes = (Invoke-WebRequest -Uri "https://raw.githubusercontent.com/slproweb/opensslhashes/master/win32_openssl_hashes.json").Content | ConvertFrom-Json
        $opensslFile = $opensslHashes.files.PSObject.Properties.Value | Where-Object {
          $_.basever -match '^3\.' -and $_.bits -eq 32 -and $_.arch -eq 'INTEL' -and $_.installer -eq 'exe' -and -not $_.light
        } | Sort-Object { [version]$_.basever } -Descending | Select-Object -First 1
        Write-Host "Latest OpenSSL 3.x (x86):" $opensslFile.basever
        Invoke-WebRequest -Uri $opensslFile.url -OutFile "openssl-installer-x86.exe"
        Start-Process -FilePath "openssl-installer-x86.exe" -ArgumentList "/verysilent /sp- /suppressmsgboxes" -Wait
        Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.9.13/python-3.9.13.exe" -OutFile "python-installer-x86.exe"
        Start-Process -FilePath "python-installer-x86.exe" -ArgumentList "/quiet ModifyAll=1 InstallAllUsers=1 Include_debug=1 TargetDir=C:\hostedtoolcache\windows\Python\3.9.13\x86" -Wait
        echo "C:\hostedtoolcache\windows\Python\3.9.13\x86" >> $env:GITHUB_PATH
        
    - if: matrix.bits == 64 && contains(matrix.os,'windows')
      name: Set 64-bit env
      run: |
        echo 'BITPLAT=x64' >> $env:GITHUB_ENV
        $opensslHashes = (Invoke-WebRequest -Uri "https://raw.githubusercontent.com/slproweb/opensslhashes/master/win32_openssl_hashes.json").Content | ConvertFrom-Json
        $opensslFile = $opensslHashes.files.PSObject.Properties.Value | Where-Object {
          $_.basever -match '^3\.' -and $_.bits -eq 64 -and $_.arch -eq 'INTEL' -and $_.installer -eq 'exe' -and -not $_.light
        } | Sort-Object { [version]$_.basever } -Descending | Select-Object -First 1
        Write-Host "Latest OpenSSL 3.x (x64):" $opensslFile.basever
        Invoke-WebRequest -Uri $opensslFile.url -OutFile "openssl-installer-x64.exe"
        Start-Process -FilePath "openssl-installer-x64.exe" -ArgumentList "/verysilent /sp- /suppressmsgboxes" -Wait
        Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.9.13/python-3.9.13-amd64.exe" -OutFile "python-installer-x64.exe"
        Start-Process -FilePath "python-installer-x64.exe" -ArgumentList "/quiet ModifyAll=1 InstallAllUsers=1 Include_debug=1 TargetDir=C:\hostedtoolcache\windows\Python\3.9.13\x64" -Wait
        echo "C:\hostedtoolcache\windows\Python\3.9.13\x64" >> $env:GITHUB_PATH
    
    - if: contains(matrix.os,'windows')
      name: Setup Windows Environment
      run: |
        If (-not (Test-Path C:\libmodbus\libmodbus)){
          Invoke-WebRequest -OutFile libmodbus.zip "https://www.dropbox.com/s/iqf95y9x1x4ol36/libmodbus.zip?dl=1"
          7z x -y libmodbus.zip
          New-Item C:\libmodbus -ItemType Directory
          Move-Item .\libmodbus C:\libmodbus\libmodbus
        }
        choco install nsis -y
        choco install ninja -y
        echo 'TOOLCHAIN_OPT=-DARCH_DESC=${{env.BITPLAT}} -DMODBUS_HOME=c:\libmodbus\libmodbus\windows${{matrix.bits}} -DPYTHON_HOME=C:\hostedtoolcache\windows\Python\3.9.13\${{env.BITPLAT}}' >> $env:GITHUB_ENV

    - if: contains(matrix.os,'macos')
      name: Setup MacOS Environment
      run: |
        brew install libmodbus socat
        echo 'TOOLCHAIN_OPT=-DOPENSSL_ROOT_DIR=/usr/local/opt/openssl@3 -DPYTHON_HOME=/opt -DMODBUS_HOME=/opt/homebrew' >> $GITHUB_ENV
        echo 'BINDIR=bin/' >> $GITHUB_ENV
    
    - if: contains(matrix.os,'windows')
      name: Set up MSVC command prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.bits == 64 && 'amd64' || 'x86' }}

    - name: Upload release text
      run: git tag -l --format='%(contents)' $(git describe) > tag_annotation.txt

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: Code/Ports/GoModbusPort/go.mod
        cache-dependency-path: Code/Ports/GoModbusPort/go.sum

    - name: Set GOPROXY with fallbacks
      shell: bash
      run: echo "GOPROXY=https://proxy.golang.org|https://goproxy.io|https://goproxy.cn|direct" >> $GITHUB_ENV

    # THROW-AWAY EXPERIMENT BRANCH: sccache, backed by the GH Actions cache,
    # so repeated pushes while iterating on the flake don't rebuild from cold.
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_INSTALL_PREFIX=${{env.INSTALL_PREFIX}} ${{env.TOOLCHAIN_OPT}} ${{env.SYSVER_OPT}} -DFULL=ON -DODC_TEST_FROM_INSTALL_TREE=ON -G Ninja

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel 8

    - name: Setup tmate session (if LOG_LVL is "debug")
      uses: mxschmitt/action-tmate@v3
      if: ${{ env.LOG_LVL == 'debug' }}

    - name: Package
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target package

    - name: Install
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target install

    - name: Record install success
      if: success()
      shell: bash
      run: echo "INSTALL_DONE=true" >> $GITHUB_ENV

    - name: Run all tests (parallel)
      if: ${{ always() && env.INSTALL_DONE == 'true' && !contains(github.ref, 'tag') }}
      run: ctest --test-dir ${{github.workspace}}/build --output-on-failure --timeout 1200 --parallel 2

    # THROW-AWAY EXPERIMENT BRANCH: stress-repeat just the flaky suite so one
    # CI run gives many chances to reproduce it, instead of one.
    - name: Stress DNP3Port_tests
      if: ${{ always() && env.INSTALL_DONE == 'true' && !contains(github.ref, 'tag') }}
      shell: pwsh
      run: |
        $iterations = 20
        $failures = 0
        for ($i = 1; $i -le $iterations; $i++) {
          Write-Host "=== DNP3Port_tests stress iteration $i/$iterations ==="
          ctest --test-dir ${{github.workspace}}/build -R CTEST_DNP3Port_tests --output-on-failure --timeout 300 --parallel 2
          if ($LASTEXITCODE -ne 0) {
            $failures++
            Write-Host "::warning::iteration $i failed (exit $LASTEXITCODE)"
          }
        }
        Write-Host "DNP3Port_tests: $failures/$iterations iterations failed"
        if ($failures -gt 0) { exit 1 }


    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.JOB_NAME}} Installer
        retention-days: 7
        path: |
          build/opendatacon-*.sh
          build/opendatacon-*.exe
          tag_annotation.txt
          
    - name: Upload Logs
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.JOB_NAME}} Logs
        retention-days: 7
        path: |
          ODC_Log*
         
  opendatacon-deploy:
    if: always() && contains(github.ref, 'tag')
    needs: [opendatacon-native]
    runs-on: macos-latest
    steps:
      - name: Download Installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: '*Installer'
          merge-multiple: true
      
      - name: Create Debug Installers Archive
        run: zip -r opendatacon-debug-installers.zip **/opendatacon-*Debug.sh **/opendatacon-*Debug.exe
          
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          body_path: installers/tag_annotation.txt
          files: |
            **/opendatacon-*.*.*-*-*-*-*-Release.sh
            **/opendatacon-*.*.*-*-*-*-*-Release.exe
            opendatacon-debug-installers.zip
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}

  opendatacon-clean:
    if: github.event_name != 'pull_request'
    needs: [opendatacon-native]
    runs-on: ubuntu-latest
    steps:
      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '1 week'
          skip-recent: 5
          skip-tags: false
