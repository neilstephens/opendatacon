{
	"LogName" :	"ODC_Log",
	"LogFileSizekB"	: 50000,
	"NumLogFiles":	1,
	"LogLevel":	"info",
	"ConsoleLevel" : "info",

	// ODC events over HTTPS with mutual TLS: Source --> Sender ==(POST /events, a JSON batch)==> Receiver --> Sink,
	// and controls from the Sink back to the Source (POST /control to the Sender) with their CommandStatus.
	// See ../README.md. Run make-certs.ps1 (or make-certs.sh) first, then opendatacon in this directory.
	"Plugins" :
	[
		{
			"Name" : "ConsoleUI",
			"Type" : "ConsoleUI",
			"Library" : "ConsoleUI",
			"ConfFilename" : "",
			"ConfOverrides" : { }
		}
	],

	"Ports" :
	[
		{
			"Name" : "Source",
			"Type" : "Lua",
			"ConfFilename" : "",
			"ConfOverrides" : { "LuaFile" : "../source.lua", "StartDelayMs" : 2000, "PeriodMs" : 2000 }
		},
		{
			"Name" : "Sender",
			"Type" : "Lua",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"LuaFile" : "../http_sender.lua",
				"Scheme" : "https",
				"Host" : "127.0.0.1",
				"LocalPort" : 20181,
				"PeerPort" : 20180,
				"BatchMs" : 1000,
				"BatchMax" : 50,
				"ControlTimeoutMs" : 5000,
				"CertFile" : "certs/sender.crt",
				"KeyFile" : "certs/sender.key",
				"CAFile" : "certs/ca.crt"
			}
		},
		{
			"Name" : "Receiver",
			"Type" : "Lua",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"LuaFile" : "../http_receiver.lua",
				"Scheme" : "https",
				"Host" : "127.0.0.1",
				"LocalPort" : 20180,
				"PeerPort" : 20181,
				"ControlTimeoutMs" : 5000,
				"CertFile" : "certs/receiver.crt",
				"KeyFile" : "certs/receiver.key",
				"CAFile" : "certs/ca.crt"
			}
		},
		{
			"Name" : "Sink",
			"Type" : "Lua",
			"ConfFilename" : "",
			"ConfOverrides" : { "LuaFile" : "../sink.lua", "ControlDelayMs" : 6000 }
		}
	],

	"Connectors" :
	[
		{
			"Name" : "SourceSide",
			"ConfFilename" : "",
			"ConfOverrides" : { "Connections" : [ { "Name" : "SourceToSender", "Port1" : "Source", "Port2" : "Sender" } ] }
		},
		{
			"Name" : "SinkSide",
			"ConfFilename" : "",
			"ConfOverrides" : { "Connections" : [ { "Name" : "ReceiverToSink", "Port1" : "Receiver", "Port2" : "Sink" } ] }
		}
	]
}
