name: opendatacon workflow

on:
  push:
    branches:
      - '**' # matches every branch
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - '**'

env:
  LOG_LVL: ${{ secrets.ACTIONS_STEP_DEBUG == 'true' && 'debug' || 'error' }}

jobs:
  # opendatacon-dockerfile-builds job disabled entirely for this throw-away experiment branch

  opendatacon-native:
    name: ${{matrix.os}} ${{matrix.build-type}} ${{matrix.bits}} 
  
    strategy:
      fail-fast: false

      # THROW-AWAY EXPERIMENT BRANCH: trimmed to just the two configs that
      # reproduce the DNP3Port_tests flake (Win64/Win32 Debug), to iterate fast.
      matrix:
        os: [windows-latest]
        build-type: [Debug]
        bits: [64]
            
        include:
          - os: windows-latest
            build-type: Debug
            bits: 32
            cross: 'none'

    runs-on: ${{ matrix.os }}

    env:
      BUILD_TYPE: ${{ matrix.build-type }}
      INSTALL_PREFIX: ${{github.workspace}}/build/install
      JOB_NAME: ${{matrix.os}}_${{matrix.build-type}}_${{matrix.bits}}
      SCCACHE_GHA_ENABLED: "true"

    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - run: git fetch --force --tags
    
    - if: matrix.bits == 32 && contains(matrix.os,'windows')
      name: Set 32-bit env
      run: |
        echo 'BITPLAT=x86' >> $env:GITHUB_ENV
        $opensslHashes = (Invoke-WebRequest -Uri "https://raw.githubusercontent.com/slproweb/opensslhashes/master/win32_openssl_hashes.json").Content | ConvertFrom-Json
        $opensslFile = $opensslHashes.files.PSObject.Properties.Value | Where-Object {
          $_.basever -match '^3\.' -and $_.bits -eq 32 -and $_.arch -eq 'INTEL' -and $_.installer -eq 'exe' -and -not $_.light
        } | Sort-Object { [version]$_.basever } -Descending | Select-Object -First 1
        Write-Host "Latest OpenSSL 3.x (x86):" $opensslFile.basever
        Invoke-WebRequest -Uri $opensslFile.url -OutFile "openssl-installer-x86.exe"
        Start-Process -FilePath "openssl-installer-x86.exe" -ArgumentList "/verysilent /sp- /suppressmsgboxes" -Wait
        Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.9.13/python-3.9.13.exe" -OutFile "python-installer-x86.exe"
        Start-Process -FilePath "python-installer-x86.exe" -ArgumentList "/quiet ModifyAll=1 InstallAllUsers=1 Include_debug=1 TargetDir=C:\hostedtoolcache\windows\Python\3.9.13\x86" -Wait
        echo "C:\hostedtoolcache\windows\Python\3.9.13\x86" >> $env:GITHUB_PATH
        
    - if: matrix.bits == 64 && contains(matrix.os,'windows')
      name: Set 64-bit env
      run: |
        echo 'BITPLAT=x64' >> $env:GITHUB_ENV
        $opensslHashes = (Invoke-WebRequest -Uri "https://raw.githubusercontent.com/slproweb/opensslhashes/master/win32_openssl_hashes.json").Content | ConvertFrom-Json
        $opensslFile = $opensslHashes.files.PSObject.Properties.Value | Where-Object {
          $_.basever -match '^3\.' -and $_.bits -eq 64 -and $_.arch -eq 'INTEL' -and $_.installer -eq 'exe' -and -not $_.light
        } | Sort-Object { [version]$_.basever } -Descending | Select-Object -First 1
        Write-Host "Latest OpenSSL 3.x (x64):" $opensslFile.basever
        Invoke-WebRequest -Uri $opensslFile.url -OutFile "openssl-installer-x64.exe"
        Start-Process -FilePath "openssl-installer-x64.exe" -ArgumentList "/verysilent /sp- /suppressmsgboxes" -Wait
        Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.9.13/python-3.9.13-amd64.exe" -OutFile "python-installer-x64.exe"
        Start-Process -FilePath "python-installer-x64.exe" -ArgumentList "/quiet ModifyAll=1 InstallAllUsers=1 Include_debug=1 TargetDir=C:\hostedtoolcache\windows\Python\3.9.13\x64" -Wait
        echo "C:\hostedtoolcache\windows\Python\3.9.13\x64" >> $env:GITHUB_PATH
    
    - if: contains(matrix.os,'windows')
      name: Setup Windows Environment
      run: |
        If (-not (Test-Path C:\libmodbus\libmodbus)){
          Invoke-WebRequest -OutFile libmodbus.zip "https://www.dropbox.com/s/iqf95y9x1x4ol36/libmodbus.zip?dl=1"
          7z x -y libmodbus.zip
          New-Item C:\libmodbus -ItemType Directory
          Move-Item .\libmodbus C:\libmodbus\libmodbus
        }
        choco install nsis -y
        choco install ninja -y
        echo 'TOOLCHAIN_OPT=-DARCH_DESC=${{env.BITPLAT}} -DMODBUS_HOME=c:\libmodbus\libmodbus\windows${{matrix.bits}} -DPYTHON_HOME=C:\hostedtoolcache\windows\Python\3.9.13\${{env.BITPLAT}}' >> $env:GITHUB_ENV

    - if: contains(matrix.os,'macos')
      name: Setup MacOS Environment
      run: |
        brew install libmodbus socat
        echo 'TOOLCHAIN_OPT=-DOPENSSL_ROOT_DIR=/usr/local/opt/openssl@3 -DPYTHON_HOME=/opt -DMODBUS_HOME=/opt/homebrew' >> $GITHUB_ENV
        echo 'BINDIR=bin/' >> $GITHUB_ENV
    
    - if: contains(matrix.os,'windows')
      name: Set up MSVC command prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.bits == 64 && 'amd64' || 'x86' }}

    - name: Upload release text
      run: git tag -l --format='%(contents)' $(git describe) > tag_annotation.txt

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: Code/Ports/GoModbusPort/go.mod
        cache-dependency-path: Code/Ports/GoModbusPort/go.sum

    - name: Set GOPROXY with fallbacks
      shell: bash
      run: echo "GOPROXY=https://proxy.golang.org|https://goproxy.io|https://goproxy.cn|direct" >> $GITHUB_ENV

    # THROW-AWAY EXPERIMENT BRANCH: sccache, backed by the GH Actions cache,
    # so repeated pushes while iterating on the flake don't rebuild from cold.
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Configure CMake
      # THROW-AWAY EXPERIMENT BRANCH: force sccache explicitly - the project's
      # own USE_COMPILER_LAUNCHER auto-detect does find_program(NAMES ccache
      # sccache), and Windows runners ship a ccache.exe bundled with Strawberry
      # Perl that wins the search (with no persistent cache dir configured),
      # so the sccache we installed above was never actually being used.
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_INSTALL_PREFIX=${{env.INSTALL_PREFIX}} ${{env.TOOLCHAIN_OPT}} ${{env.SYSVER_OPT}} -DFULL=ON -DODC_TEST_FROM_INSTALL_TREE=ON -DUSE_COMPILER_LAUNCHER=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_C_COMPILER_LAUNCHER=sccache -G Ninja

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel 8

    # THROW-AWAY EXPERIMENT BRANCH: confirm sccache is actually being used
    - name: sccache stats
      run: sccache --show-stats

    - name: Setup tmate session (if LOG_LVL is "debug")
      uses: mxschmitt/action-tmate@v3
      if: ${{ env.LOG_LVL == 'debug' }}

    - name: Package
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target package

    - name: Install
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target install

    - name: Record install success
      if: success()
      shell: bash
      run: echo "INSTALL_DONE=true" >> $GITHUB_ENV

    # THROW-AWAY EXPERIMENT BRANCH: capture a minidump on crash so we can get
    # a real stack trace instead of guessing from the exit code.
    - name: Enable WER local crash dumps
      shell: pwsh
      run: |
        # both views: a 32-bit test process on 64-bit Windows reads the
        # WOW6432Node-redirected key, not the native 64-bit one
        foreach ($key in 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\Windows Error Reporting\LocalDumps') {
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value 'D:\crashdumps' -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 20 -PropertyType DWord -Force | Out-Null
        }
        New-Item -Path 'D:\crashdumps' -ItemType Directory -Force | Out-Null

    - name: Run all tests (parallel)
      if: ${{ always() && env.INSTALL_DONE == 'true' && !contains(github.ref, 'tag') }}
      run: ctest --test-dir ${{github.workspace}}/build --output-on-failure --timeout 1200 --parallel 2

    # THROW-AWAY EXPERIMENT BRANCH: the crash exits 0xC0000409
    # (STATUS_STACK_BUFFER_OVERRUN), which is what MSVC's STL iterator checks
    # raise via __fastfail() - that bypasses abort()/WER entirely, so run
    # DNP3Port_tests directly under cdb (attached from launch) a few times,
    # which intercepts even fastfail, to get a real stack trace.
    - name: Stress DNP3Port_tests under cdb
      if: ${{ always() && env.INSTALL_DONE == 'true' && !contains(github.ref, 'tag') }}
      timeout-minutes: 45
      shell: pwsh
      run: |
        $cdbArch = "${{ matrix.bits }}" -eq "64" ? "x64" : "x86"
        $cdb = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\Debuggers\$cdbArch","C:\Program Files\Microsoft Visual Studio" -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $cdb) { Write-Host "cdb.exe not found - skipping"; exit 0 }
        Write-Host "Using cdb: $($cdb.FullName)"
        $exe = Get-ChildItem -Path ${{github.workspace}}/build -Recurse -Filter DNP3Port_tests.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $exe) { Write-Host "DNP3Port_tests.exe not found - skipping"; exit 0 }
        Write-Host "Using exe: $($exe.FullName)"

        # generate real competing CPU load - the crash needs actual
        # contention, an isolated run under cdb alone won't reproduce it
        $loadJob = Start-Job -ScriptBlock {
          param($buildDir, $workspace)
          while ($true) {
            Push-Location "$workspace/Code/tests/ODC_tests"
            & "$buildDir/ODC_tests.exe" *> $null
            Pop-Location
            Push-Location "$workspace/Code/tests/MD3Port_tests"
            & "$buildDir/MD3Port_tests.exe" *> $null
            Pop-Location
          }
        } -ArgumentList $exe.Directory.FullName,"${{github.workspace}}"

        Push-Location "${{github.workspace}}/Code/tests/DNP3Port_tests"
        # Targeting a specific fast test case (~7s standalone) so we can
        # afford many more iterations than a full-suite run would allow
        $testFilter = '"*Quality and CommsPoint - UDP connected*"'
        for ($i = 1; $i -le 40; $i++) {
          Write-Host "=== cdb iteration $i ==="
          $logPath = "D:\crashdumps\cdb_iter_${i}.log"
          $cdbArgLine = '-g -G -hd -y "' + $exe.Directory.FullName + '" -logo "' + $logPath + '" -c "sxd e06d7363; g; !analyze -v; ~*k; q" "' + $exe.FullName + '" ' + $testFilter
          $p = Start-Process -FilePath $cdb.FullName -ArgumentList $cdbArgLine -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) {
            Write-Host "*** iteration $i timed out after 60s - killing cdb ***"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path $logPath) {
            if (Select-String -Path $logPath -Pattern "ExceptionAddress|STACK_TEXT|FAULTING_IP" -Quiet) {
              Write-Host "*** iteration ${i}: crash detected, dumping log ***"
              Get-Content $logPath | Write-Host
            } else {
              Write-Host "iteration ${i}: no crash (log tail follows)"
              Get-Content $logPath -Tail 5 | Write-Host
            }
          }
        }
        Pop-Location

        Stop-Job $loadJob -ErrorAction SilentlyContinue
        Remove-Job $loadJob -Force -ErrorAction SilentlyContinue
        Get-Process ODC_tests,MD3Port_tests -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

    - name: Upload crash dumps
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.JOB_NAME}} CrashDumps
        retention-days: 7
        path: |
          D:\crashdumps\*.dmp
          D:\crashdumps\*.log

    - name: Analyze crash dumps (best-effort)
      if: always()
      shell: pwsh
      run: |
        $cdbArch = "${{ matrix.bits }}" -eq "64" ? "x64" : "x86"
        $cdb = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\Debuggers\$cdbArch","C:\Program Files\Microsoft Visual Studio" -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $cdb) { Write-Host "cdb.exe not found - skipping dump analysis"; exit 0 }
        Write-Host "Using cdb: $($cdb.FullName)"
        Get-ChildItem D:\crashdumps\*.dmp -ErrorAction SilentlyContinue | ForEach-Object {
          Write-Host "=== Analyzing $($_.FullName) ==="
          & $cdb.FullName -z $_.FullName -c "!analyze -v; ~*k; q" 2>&1 | Write-Host
        }

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.JOB_NAME}} Installer
        retention-days: 7
        path: |
          build/opendatacon-*.sh
          build/opendatacon-*.exe
          tag_annotation.txt
          
    - name: Upload Logs
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.JOB_NAME}} Logs
        retention-days: 7
        path: |
          ODC_Log*
         
  opendatacon-deploy:
    if: always() && contains(github.ref, 'tag')
    needs: [opendatacon-native]
    runs-on: macos-latest
    steps:
      - name: Download Installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: '*Installer'
          merge-multiple: true
      
      - name: Create Debug Installers Archive
        run: zip -r opendatacon-debug-installers.zip **/opendatacon-*Debug.sh **/opendatacon-*Debug.exe
          
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          body_path: installers/tag_annotation.txt
          files: |
            **/opendatacon-*.*.*-*-*-*-*-Release.sh
            **/opendatacon-*.*.*-*-*-*-*-Release.exe
            opendatacon-debug-installers.zip
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}

  opendatacon-clean:
    if: github.event_name != 'pull_request'
    needs: [opendatacon-native]
    runs-on: ubuntu-latest
    steps:
      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '1 week'
          skip-recent: 5
          skip-tags: false
