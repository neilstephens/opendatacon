{
	// ICCP Peer A. Its port type (ICCPClient in opendatacon.conf) makes it connect to the peer; everything else is the same as for a
	// listening port. "Local" is this port, "Remote" the peer. All names and values are synthetic.
	"ServiceRole" : "Peer",
	"IP" : "127.0.0.1",
	"Port" : "10112",
	"TCPConnectRetryPeriodms" : 2000,

	"LocalTSelector" : "0001",  "RemoteTSelector" : "0002",
	"LocalSSelector" : "0001",  "RemoteSSelector" : "0002",
	"LocalPSelector" : "00000001",  "RemotePSelector" : "00000002",
	"LocalAPTitle" : "1.3.9999.1.1",  "LocalAEQualifier" : 1,
	"RemoteAPTitle" : "1.3.9999.1.2", "RemoteAEQualifier" : 2,

	"TASE2Edition" : "2000-08",
	"BilateralTableID" : "BT_EXAMPLE_A",
	"RemoteBilateralTableID" : "BT_EXAMPLE_B",
	"LocalDomain" : "DOMAIN_A",
	"RemoteDomain" : "DOMAIN_B",

	// the points: "Serve" = fed by ODC events (the Sim port) and served to the peer; "Read" = read from the peer and published to ODC.
	// The Read points have their own index range (100 and up) so that they cannot be mistaken for the served ones.
	"Binaries" : [{"Index" : 0, "Name" : "A_STATE", "Type" : "StateQ", "Direction" : "Serve"},
		{"Index" : 100, "Name" : "B_STATE", "Type" : "StateQ", "Direction" : "Read"}],
	"Analogs" : [{"Index" : 0, "Name" : "A_MW", "Type" : "RealQ", "Direction" : "Serve"},
		{"Index" : 100, "Name" : "B_MW", "Type" : "RealQ", "Direction" : "Read"}],

	// a data set of the peer's points, defined on the peer, and the transfer set that reports it
	"DataSets" : [{"Name" : "DS_B_001", "Members" : ["B_STATE", "B_MW"]}],
	"TransferSets" : [{"DataSet" : "DS_B_001", "Conditions" : ["ObjectChange", "IntegrityTimeOut"], "IntegrityCheck" : 20}],

	// the transfer sets this port offers to the peer
	"TransferSetPool" : ["TS_A_1", "TS_A_2"],

	// ---- control devices (TASE.2 Block 5, device control). "Serve": a device of this port, operated by the peer (published to ODC with this Index);
	// "Operate": a device of the peer that this port operates from ODC control events with this Index. A Peer must say which for each.
	"BinaryControls" : [{"Index" : 0, "Name" : "A_BREAKER", "Direction" : "Serve"},
		{"Index" : 100, "Name" : "B_BREAKER", "Direction" : "Operate"}]
}
