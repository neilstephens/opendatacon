{
	"LogName" : "ODC_Log",
	"LogFileSizekB" : 50000,
	"NumLogFiles" : 1,
	"LogLevel": "info",
	"ConsoleLevel" : "info",
	"TCPLog":
	{
		"IP" : "127.0.0.1",
		"Port" : 12345,
		"TCPClientServer" : "CLIENT"
	},

	"Plugins":
	[
		{
			"Name" : "ConsoleUI-1",
			"Type" : "ConsoleUI",
			"Library" : "ConsoleUI",
			"ConfFilename" : "",
			"ConfOverrides" : { }
		},
		{
			"Name" : "WebUI-1",
			"Type" : "WebUI",
			"Library" : "WebUI",
			"ConfFilename" : "",
			"ConfOverrides" : { "IP" : "127.0.0.1", "Port" : 10443 }
		}
	],

	"Ports":
	[
		// ====================================================================
		// Modbus TCP master talking to the public test server at
		// 45.8.248.56:502.  Ten slaves expose registers in different numeric
		// formats (UINT16, UINT32, Float) and byte/word orders (ABCD, CDAB,
		// BADC, DCBA).  We configure one GoModbus port per slave.
		//
		// Each device config is loaded from a separate file via ConfFilename.
		// The ODC Event index ranges are:
		//
		//   Slave   Format         Indices         Register type
		//   ─────   ─────────────  ─────────────── ──────────────────
		//   1       UINT16         1000–1015 (bin) Coils
		//                           1100–1109 (ana) Holding Registers
		//   2       UINT32_ABCD    1200–1202 (ana) Holding Registers
		//   6       FLOAT_ABCD     1600–1602 (ana) Holding Registers
		//   9       FLOAT_DCBA     1900–1902 (ana) Holding Registers
		//  10       UINT16 (time)  2000–2099 (ana) Input Registers
		// ====================================================================

		{
			"Name" : "ModbusSlave01_UINT16",
			"Type" : "GoModbus",
			"Library" : "GoModbusPort",
			"ConfFilename" : "device_slave01_uint16.conf",
			"ConfOverrides" : {}
		},
		{
			"Name" : "ModbusSlave02_UINT32",
			"Type" : "GoModbus",
			"Library" : "GoModbusPort",
			"ConfFilename" : "device_slave02_uint32_abcd.conf",
			"ConfOverrides" : {}
		},
		{
			"Name" : "ModbusSlave06_Float",
			"Type" : "GoModbus",
			"Library" : "GoModbusPort",
			"ConfFilename" : "device_slave06_float_abcd.conf",
			"ConfOverrides" : {}
		},
		{
			"Name" : "ModbusSlave09_FloatRev",
			"Type" : "GoModbus",
			"Library" : "GoModbusPort",
			"ConfFilename" : "device_slave09_float_dcba.conf",
			"ConfOverrides" : {}
		},
		{
			"Name" : "ModbusSlave10_Time",
			"Type" : "GoModbus",
			"Library" : "GoModbusPort",
			"ConfFilename" : "device_slave10_time.conf",
			"ConfOverrides" : {}
		},

		// ====================================================================
		// JSON client output — connects to an external JSON consumer on
		// port 2598. Every event is streamed as a JSON line.
		// ====================================================================
		{
			"Name" : "JSON",
			"Type" : "JSONClient",
			"Library" : "JSONPort",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"IP" : "127.0.0.1",
				"Port" : 2598,
				"PrintAllEvents" : true,
				"JSONPointConf" :
				[
					{
						"PointType" : "Binary",
						"Points" :
						[
							// Slave 1 coils
							{"Index": 1000, "Name": "Slv1_Coil_0"},
							{"Index": 1001, "Name": "Slv1_Coil_1"},
							{"Index": 1002, "Name": "Slv1_Coil_2"},
							{"Index": 1003, "Name": "Slv1_Coil_3"},
							{"Index": 1004, "Name": "Slv1_Coil_4"},
							{"Index": 1005, "Name": "Slv1_Coil_5"},
							{"Index": 1006, "Name": "Slv1_Coil_6"},
							{"Index": 1007, "Name": "Slv1_Coil_7"},
							{"Index": 1008, "Name": "Slv1_Coil_8"},
							{"Index": 1009, "Name": "Slv1_Coil_9"},
							{"Index": 1010, "Name": "Slv1_Coil_10"},
							{"Index": 1011, "Name": "Slv1_Coil_11"},
							{"Index": 1012, "Name": "Slv1_Coil_12"},
							{"Index": 1013, "Name": "Slv1_Coil_13"},
							{"Index": 1014, "Name": "Slv1_Coil_14"},
							{"Index": 1015, "Name": "Slv1_Coil_15"}
						]
					},
					{
						"PointType" : "Analog",
						"Points" :
						[
							// Slave 1 — UINT16 holding registers
							{"Index": 1100, "Name": "Slv1_HR_1"},
							{"Index": 1101, "Name": "Slv1_HR_2"},
							{"Index": 1102, "Name": "Slv1_HR_3"},
							{"Index": 1103, "Name": "Slv1_HR_4"},
							{"Index": 1104, "Name": "Slv1_HR_5"},
							{"Index": 1105, "Name": "Slv1_HR_6"},
							{"Index": 1106, "Name": "Slv1_HR_7"},
							{"Index": 1107, "Name": "Slv1_HR_8"},
							{"Index": 1108, "Name": "Slv1_HR_9"},
							{"Index": 1109, "Name": "Slv1_HR_10"},

							// Slave 2 — UINT32_ABCD holding registers
							{"Index": 1200, "Name": "Slv2_HR1_U32_ABCD"},
							{"Index": 1201, "Name": "Slv2_HR3_U32_ABCD"},
							{"Index": 1202, "Name": "Slv2_HR5_U32_ABCD"},

							// Slave 6 — FLOAT_ABCD holding registers
							{"Index": 1600, "Name": "Slv6_HR1_F32_ABCD"},
							{"Index": 1601, "Name": "Slv6_HR3_F32_ABCD"},
							{"Index": 1602, "Name": "Slv6_HR5_F32_ABCD"},

							// Slave 9 — FLOAT_DCBA holding registers
							{"Index": 1900, "Name": "Slv9_HR1_F32_DCBA"},
							{"Index": 1901, "Name": "Slv9_HR3_F32_DCBA"},
							{"Index": 1902, "Name": "Slv9_HR5_F32_DCBA"},

							// Slave 10 — UTC+00:00 input register time
							{"Index": 2000, "Name": "UTC0_Year"},
							{"Index": 2001, "Name": "UTC0_Month"},
							{"Index": 2002, "Name": "UTC0_Day"},
							{"Index": 2003, "Name": "UTC0_Hour"},
							{"Index": 2004, "Name": "UTC0_Minute"},
							{"Index": 2005, "Name": "UTC0_Second"},
							{"Index": 2006, "Name": "UTC0_DayOfWeek"},
							{"Index": 2007, "Name": "UTC0_TzOffset"},

							// Slave 10 — UTC+03:00 (Moscow) input register time
							{"Index": 2010, "Name": "MSK_Year"},
							{"Index": 2011, "Name": "MSK_Month"},
							{"Index": 2012, "Name": "MSK_Day"},
							{"Index": 2013, "Name": "MSK_Hour"},
							{"Index": 2014, "Name": "MSK_Minute"},
							{"Index": 2015, "Name": "MSK_Second"},

							// Slave 10 — UTC+09:00 (Tokyo) input register time
							{"Index": 2020, "Name": "TYO_Year"},
							{"Index": 2021, "Name": "TYO_Month"},
							{"Index": 2022, "Name": "TYO_Day"},
							{"Index": 2023, "Name": "TYO_Hour"},
							{"Index": 2024, "Name": "TYO_Minute"},
							{"Index": 2025, "Name": "TYO_Second"},

							// Slave 10 — UTC-05:00 (New York) input register time
							{"Index": 2030, "Name": "NYC_Year"},
							{"Index": 2031, "Name": "NYC_Month"},
							{"Index": 2032, "Name": "NYC_Day"},
							{"Index": 2033, "Name": "NYC_Hour"},
							{"Index": 2034, "Name": "NYC_Minute"},
							{"Index": 2035, "Name": "NYC_Second"},

							// Slave 10 — Unix timestamp
							{"Index": 2099, "Name": "UnixTimestamp"}
						]
					},
					{
						"PointType" : "Control",
						"Points" :
						[
							// Slave 1 coil 100 — pulse/clear via JSON
							{
								"Index": 0,
								"JSONPath" : ["controls", "slv1_coil100"],
								"ControlMode" : "PULSE",
								"OnVal" : "PULSE",
								"OffVal" : "CLEAR"
							}
						]
					}
				]
			}
		}
	],

	"Connectors":
	[
		{
			"Name" : "Connector",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"Connections":
				[
					// Every Modbus slave port feeds into the single JSON port
					{"Name": "C_Slv1_JSON", "Port1": "ModbusSlave01_UINT16", "Port2": "JSON"},
					{"Name": "C_Slv2_JSON", "Port1": "ModbusSlave02_UINT32", "Port2": "JSON"},
					{"Name": "C_Slv6_JSON", "Port1": "ModbusSlave06_Float",  "Port2": "JSON"},
					{"Name": "C_Slv9_JSON", "Port1": "ModbusSlave09_FloatRev","Port2": "JSON"},
					{"Name": "C_Slv10_JSON","Port1": "ModbusSlave10_Time",   "Port2": "JSON"}
				]
			}
		}
	]
}
