{
     "Inherits": ["FileTransferCommon.conf"],
     "Direction": "TX",
     "Directory": "./TX",
     "FilenameRegex": "(.*\\.bin)",
     "Recursive": true,
     "FileNameTransmission": { "Index": 0, "MatchGroup": 1 },
     "TransferTriggers": [
          { "Type": "Periodic", "Periodms": 1000, "OnlyWhenModified": true },
          { "Type": "BinaryControl", "Index": 0, "OnlyWhenModified": false }
     ]
}
