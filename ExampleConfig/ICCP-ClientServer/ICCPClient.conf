{
	// ICCP (TASE.2) client port: connects to the server, associates, defines a data set and starts a transfer set.
	// Values that arrive in reports are published as ODC events. All names and values are synthetic.
	// The ServiceRole is not given: an ICCPClient port defaults to "Client", so its points are read from the peer ("Direction": "Read").
	"IP" : "127.0.0.1",
	"Port" : "10102",
	"TCPConnectRetryPeriodms" : 2000,

	// ---- addressing: the mirror image of the server's
	"LocalTSelector" : "0002",  "RemoteTSelector" : "0001",
	"LocalSSelector" : "0002",  "RemoteSSelector" : "0001",
	"LocalPSelector" : "00000002",  "RemotePSelector" : "00000001",
	"LocalAPTitle" : "1.3.9999.1.2",  "LocalAEQualifier" : 2,
	"RemoteAPTitle" : "1.3.9999.1.1", "RemoteAEQualifier" : 1,

	// ---- TASE.2
	"TASE2Edition" : "2000-08",
	"BilateralTableID" : "BT_EXAMPLE_B",
	"RemoteBilateralTableID" : "BT_EXAMPLE_A",   // must match what the server reports, else the association is dropped
	"LocalDomain" : "DOMAIN_B",
	"RemoteDomain" : "DOMAIN_A",                 // the domain the points are read from

	// ---- points (the same names and types as the server's)
	"Binaries" : [{"Index" : 0, "Name" : "POINT_0001_ST", "Type" : "StateQ"},
		{"Index" : 1, "Name" : "POINT_0002_ST", "Type" : "StateQ"}],
	"Analogs" : [{"Index" : 0, "Name" : "POINT_0001_MW", "Type" : "RealQ"},
		{"Index" : 1, "Name" : "POINT_0002_MW", "Type" : "RealQ", "ScaleFactor" : 1.0, "Offset" : 0.0}],

	// the data set the client defines on the server, and the transfer set that reports it. "Critical" : true makes the server's reports critical: this client
	// acknowledges each one (Transfer_Report_ACK, with the report's Transfer_Set_Time_Stamp, so that object is in the data set's special objects), and the
	// server logs and counts a report that is not acknowledged (see the README, "Critical reports and the time limit TLE").
	"DataSets" : [{"Name" : "DS_EXAMPLE_001", "Members" : ["POINT_0001_ST", "POINT_0002_ST", "POINT_0001_MW", "POINT_0002_MW"]}],
	"TransferSets" : [{"DataSet" : "DS_EXAMPLE_001", "Conditions" : ["ObjectChange", "IntegrityTimeOut"],
		"IntegrityCheck" : 20, "BufferTime" : 1,
		"Critical" : true, "SpecialObjects" : ["Transfer_Set_Name", "Transfer_Set_Time_Stamp", "DSConditions_Detected"]}],

	// ---- control devices of the server that this client operates (TASE.2 Block 5, device control; the client requires the server to support it).
	// An ODC control event with the Index below (ControlRelayOutputBlock for BinaryControls, AnalogOutput* for AnalogControls) is turned into a
	// select + operate (or a direct operate) on the server, and the result goes back as the ODC command status. The names are the server's.
	"BinaryControls" : [{"Index" : 0, "Name" : "DEVICE_0001_CMD"},
		{"Index" : 1, "Name" : "DEVICE_0002_CMD", "SelectRequired" : false}],
	"AnalogControls" : [{"Index" : 0, "Name" : "DEVICE_0001_SP", "Type" : "RealSetpoint", "ScaleFactor" : 1.0, "Offset" : 0.0}]
}
