{
	"LogName" :	"ODC_Log",
	"LogFileSizekB"	: 50000,
	"NumLogFiles":	1,
	"LogLevel":	"info",
	"ConsoleLevel" : "info",

	// ODC events over TCP: Source --> Sender ==(TCP, one JSON line per event)==> Receiver --> Sink,
	// and controls from the Sink back to the Source with their CommandStatus. See ../README.md.
	// Run opendatacon in this directory (the Lua files are in the directory above).
	"Plugins" :
	[
		{
			"Name" : "ConsoleUI",
			"Type" : "ConsoleUI",
			"Library" : "ConsoleUI",
			"ConfFilename" : "",
			"ConfOverrides" : { }
		}
	],

	"Ports" :
	[
		{
			"Name" : "Source",
			"Type" : "Lua",
			"ConfFilename" : "",
			"ConfOverrides" : { "LuaFile" : "../source.lua", "StartDelayMs" : 2000, "PeriodMs" : 2000 }
		},
		{
			"Name" : "Sender",
			"Type" : "Lua",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"LuaFile" : "../socket_sender.lua",
				"UseTLS" : false,
				"Host" : "127.0.0.1",
				"Port" : 20150,
				"RetryMs" : 500
			}
		},
		{
			"Name" : "Receiver",
			"Type" : "Lua",
			"ConfFilename" : "",
			"ConfOverrides" :
			{
				"LuaFile" : "../socket_receiver.lua",
				"UseTLS" : false,
				"Host" : "127.0.0.1",
				"Port" : 20150,
				"ControlTimeoutMs" : 5000
			}
		},
		{
			"Name" : "Sink",
			"Type" : "Lua",
			"ConfFilename" : "",
			"ConfOverrides" : { "LuaFile" : "../sink.lua", "ControlDelayMs" : 6000 }
		}
	],

	"Connectors" :
	[
		{
			"Name" : "SourceSide",
			"ConfFilename" : "",
			"ConfOverrides" : { "Connections" : [ { "Name" : "SourceToSender", "Port1" : "Source", "Port2" : "Sender" } ] }
		},
		{
			"Name" : "SinkSide",
			"ConfFilename" : "",
			"ConfOverrides" : { "Connections" : [ { "Name" : "ReceiverToSink", "Port1" : "Receiver", "Port2" : "Sink" } ] }
		}
	]
}
