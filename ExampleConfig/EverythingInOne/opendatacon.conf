{
     "LogName": "ODC_Log",
     "LogFileSizekB": 10000,
     "NumLogFiles": 1,
     "LogLevel": "debug",
     "ConsoleLevel": "info",

     "LuaLog":
     {
          "LuaFile": "LuaLogSink.lua",
          "LogLevel": "warn"
     },

     "Plugins":
     [
          {
               "Name": "ConsoleUI-1",
               "Type": "ConsoleUI",
               "Library": "ConsoleUI",
               "ConfFilename": "",
               "ConfOverrides": { "Banner": "EverythingInOne" }
          },
          {
               "Name": "WebUI-1",
               "Type": "WebUI",
               "Library": "WebUI",
               "ConfFilename": "",
               "ConfOverrides": { "IP": "127.0.0.1", "Port": 10443 }
          },
          {
               "Name": "LuaUICommander-1",
               "Type": "LuaUICommander",
               "ConfFilename": "",
               "ConfOverrides": { "QueueSize": 200 }
          }
     ],

     "Ports":
     [
          {
               "Name": "NullPort",
               "Type": "Null",
               "ConfFilename": "/dev/null",
               "ConfOverrides": { "DropAll": true }
          },
          {
               "Name": "SimPort",
               "Type": "Sim",
               "ConfFilename": "SimPort.conf",
               "ConfOverrides": { "Analogs": [{ "Index": 3, "StartVal": 321, "UpdateIntervalms": 5000, "StdDev": 0.5 }] }
          },
          {
               "Name": "JSONClientPort",
               "Type": "JSONClient",
               "Library": "JSONPort",
               "ConfFilename": "JSONClientPort.conf",
               "ConfOverrides": { "Port": 2598 }
          },
          {
               "Name": "JSONServerPort",
               "Type": "JSONServer",
               "Library": "JSONPort",
               "ConfFilename": "JSONServerPort.conf",
               "ConfOverrides": { "Port": 2599 }
          },
          {
               "Name": "DNP3MasterPort",
               "Type": "DNP3Master",
               "Library": "DNP3Port",
               "ConfFilename": "DNP3MasterPort.conf",
               "ConfOverrides": { "OutstationAddr": 11, "Port": 21000, "TCPClientServer": "CLIENT" }
          },
          {
               "Name": "DNP3OutstationPort",
               "Type": "DNP3Outstation",
               "Library": "DNP3Port",
               "ConfFilename": "DNP3OutstationPort.conf",
               "ConfOverrides": { "OutstationAddr": 11, "Port": 21000, "TCPClientServer": "SERVER" }
          },
          {
               "Name": "ModbusMasterPort",
               "Type": "ModbusMaster",
               "Library": "ModbusPort",
               "ConfFilename": "ModbusMasterPort.conf",
               "ConfOverrides": { "Port": 2502, "ServerType": "PERSISTENT" }
          },
          {
               "Name": "ModbusOutstationPort",
               "Type": "ModbusOutstation",
               "Library": "ModbusPort",
               "ConfFilename": "ModbusOutstationPort.conf",
               "ConfOverrides": { "Port": 2502, "ServerType": "PERSISTENT" }
          },
          {
               "Name": "MD3MasterPort",
               "Type": "MD3Master",
               "Library": "MD3Port",
               "ConfFilename": "MD3MasterPort.conf",
               "ConfOverrides": { "Port": 22000, "OutstationAddr": 12, "TCPClientServer": "CLIENT" }
          },
          {
               "Name": "MD3OutstationPort",
               "Type": "MD3Outstation",
               "Library": "MD3Port",
               "ConfFilename": "MD3OutstationPort.conf",
               "ConfOverrides": { "Port": 22000, "OutstationAddr": 12, "TCPClientServer": "SERVER" }
          },
          {
               "Name": "CBMasterPort",
               "Type": "CBMaster",
               "Library": "CBPort",
               "ConfFilename": "CBMasterPort.conf",
               "ConfOverrides": { "Port": "23000", "OutstationAddr": 13, "TCPClientServer": "CLIENT" }
          },
          {
               "Name": "CBOutstationPort",
               "Type": "CBOutstation",
               "Library": "CBPort",
               "ConfFilename": "CBOutstationPort.conf",
               "ConfOverrides": { "Port": "23000", "OutstationAddr": 13, "TCPClientServer": "SERVER" }
          },
          {
               "Name": "FileTransferTXPort",
               "Type": "FileTransfer",
               "Library": "FileTransferPort",
               "ConfFilename": "FileTransferTXPort.conf",
               "ConfOverrides": { "Directory": "./TX", "TransferTimeoutms": 1500 }
          },
          {
               "Name": "FileTransferRXPort",
               "Type": "FileTransfer",
               "Library": "FileTransferPort",
               "ConfFilename": "FileTransferRXPort.conf",
               "ConfOverrides": { "Directory": "./RX", "OverwriteMode": "OVERWRITE" }
          },
          {
               "Name": "LuaPort",
               "Type": "Lua",
               "Library": "LuaPort",
               "ConfFilename": "LuaPort.conf",
               "ConfOverrides": { "LuaFile": "EverythingLuaPort.lua" }
          },
          {
               "Name": "PyPort",
               "Type": "Py",
               "Library": "PyPort",
               "ConfFilename": "PyPort.conf",
               "ConfOverrides": { "Port": 10090, "EventsAreQueued": true, "OnlyQueueEventsWithTags": false }
          },
          {
               "Name": "KafkaProducerPort",
               "Type": "KafkaProducer",
               "Library": "KafkaPort",
               "ConfFilename": "KafkaProducerPort.conf",
               "ConfOverrides": { "DefaultTopic": "odc-everything-raw" }
          },
          {
               "Name": "KafkaConsumerPort",
               "Type": "KafkaConsumer",
               "Library": "KafkaPort",
               "ConfFilename": "KafkaConsumerPort.conf",
               "ConfOverrides": { "DefaultTopic": "odc-everything-raw", "ConsumerFastForwardOffset": 0 }
          },
          {
               "Name": "GoModbusClientPort",
               "Type": "GoModbusClient",
               "Library": "GoModbusPort",
               "ConfFilename": "GoModbusClientPort.conf.json",
               "ConfOverrides": { "PollRateMs": 1500, "TimeoutMs": 2500 }
          },
          {
               "Name": "GoModbusServerPort",
               "Type": "GoModbusServer",
               "Library": "GoModbusPort",
               "ConfFilename": "GoModbusServerPort.conf.json",
               "ConfOverrides": { "UnitID": 2 }
          }
     ],

     "Connectors":
     [
          {
               "Name": "TelemetryFanout",
               "ConfFilename": "ConnectorDefaults.conf",
               "ConfOverrides":
               {
                    "Connections":
                    [
                         { "Name": "SimToJSONClient", "Port1": "SimPort", "Port2": "JSONClientPort" },
                         { "Name": "SimToDNP3Out", "Port1": "SimPort", "Port2": "DNP3OutstationPort" },
                         { "Name": "SimToKafkaProducer", "Port1": "SimPort", "Port2": "KafkaProducerPort" },
                         { "Name": "SimToGoModbusServer", "Port1": "SimPort", "Port2": "GoModbusServerPort" }
                    ]
               }
          },
          {
               "Name": "ProtocolLoopbackA",
               "ConfFilename": "ConnectorDefaults.conf",
               "ConfOverrides":
               {
                    "Connections":
                    [
                         { "Name": "DNP3Pair", "Port1": "DNP3MasterPort", "Port2": "DNP3OutstationPort" },
                         { "Name": "ModbusPair", "Port1": "ModbusMasterPort", "Port2": "ModbusOutstationPort" },
                         { "Name": "GoModbusPair", "Port1": "GoModbusClientPort", "Port2": "GoModbusServerPort" }
                    ]
               }
          },
          {
               "Name": "ProtocolLoopbackB",
               "ConfFilename": "ConnectorDefaults.conf",
               "ConfOverrides":
               {
                    "Connections":
                    [
                         { "Name": "MD3Pair", "Port1": "MD3MasterPort", "Port2": "MD3OutstationPort" },
                         { "Name": "CBPair", "Port1": "CBMasterPort", "Port2": "CBOutstationPort" },
                         { "Name": "FileTransferPair", "Port1": "FileTransferTXPort", "Port2": "FileTransferRXPort" }
                    ]
               }
          },
          {
               "Name": "JSONAndScriptConnector",
               "ConfFilename": "ConnectorDefaults.conf",
               "ConfOverrides":
               {
                    "Connections":
                    [
                         { "Name": "JSONServerToJSONClient", "Port1": "JSONServerPort", "Port2": "JSONClientPort" },
                         { "Name": "PyToJSONServer", "Port1": "PyPort", "Port2": "JSONServerPort" },
                         { "Name": "LuaToNull", "Port1": "LuaPort", "Port2": "NullPort" },
                         { "Name": "KafkaConsumerToNull", "Port1": "KafkaConsumerPort", "Port2": "NullPort" }
                    ]
               }
          },
          {
               "Name": "TransformShowcase",
               "ConfFilename": "ConnectorDefaults.conf",
               "ConfOverrides":
               {
                    "Connections":
                    [
                         { "Name": "TransformSimToNull", "Port1": "SimPort", "Port2": "NullPort" },
                         { "Name": "TransformPyToNull", "Port1": "PyPort", "Port2": "NullPort" },
                         { "Name": "TransformLuaToNull", "Port1": "LuaPort", "Port2": "NullPort" }
                    ],
                    "Transforms":
                    [
                         {
                              "Name": "TxIndexOffset",
                              "Type": "IndexOffset",
                              "Sender": "SimPort",
                              "Parameters": { "Offset": 10 }
                         },
                         {
                              "Name": "TxIndexMap",
                              "Type": "IndexMap",
                              "Sender": "SimPort",
                              "Parameters":
                              {
                                   "BinaryMap": { "From": [0, 1], "To": [100, 101] },
                                   "AnalogMap": { "From": [0, 1], "To": [200, 201] }
                              }
                         },
                         {
                              "Name": "TxThreshold",
                              "Type": "Threshold",
                              "Sender": "SimPort",
                              "Parameters": { "threshold_point_index": 0, "threshold": 20.0, "points": [1, 2, 3] }
                         },
                         {
                              "Name": "TxRand",
                              "Type": "Rand",
                              "Sender": "SimPort",
                              "Parameters": { }
                         },
                         {
                              "Name": "TxRateLimit",
                              "Type": "RateLimit",
                              "Sender": "SimPort",
                              "Parameters": { "Name": "EverythingRate", "outputRateLimit": 50, "updatePeriodms": 1000, "updatePeriodMultiplier": 2 }
                         },
                         {
                              "Name": "TxLogicInv",
                              "Type": "LogicInv",
                              "Sender": "SimPort",
                              "Parameters": { }
                         },
                         {
                              "Name": "TxAnalogScaling",
                              "Type": "AnalogScaling",
                              "Sender": "SimPort",
                              "Parameters": { "Indexes": [0, 1], "ScaleFactors": [1.5, 0.5], "Offsets": [10.0, -10.0] }
                         },
                         {
                              "Name": "TxLuaTransform",
                              "Type": "Lua",
                              "Sender": "SimPort",
                              "Parameters": { "LuaFile": "EverythingLuaTransform.lua" }
                         },
                         {
                              "Name": "TxBlackHole",
                              "Type": "BlackHole",
                              "Sender": "PyPort",
                              "Parameters": { }
                         }
                    ]
               }
          }
     ]
}
