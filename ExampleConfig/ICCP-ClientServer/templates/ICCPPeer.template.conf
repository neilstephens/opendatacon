{
	// ICCP PEER TEMPLATE: one configuration that works under either port type (Type "ICCPClient" = this port connects, "ICCPServer" = it listens).
	// The service role is "Peer": this port serves points to the peer AND reads the peer's points, on the one association.
	// Local/Remote always mean "this port"/"the peer", whichever side connects. The association is initiated by whichever side connects.
	// Replace every <PLACEHOLDER>. Not loadable until then.
	"ServiceRole" : "Peer",

	// ---- connection: a connecting port needs the peer's address; a listening port the address to bind (0.0.0.0 = all)
	"IP" : "<PEER_IP_ADDRESS or 0.0.0.0>",
	"Port" : "102",
	"TCPConnectRetryPeriodms" : 0,               // connecting port only: 0 = exponential back-off

	// ---- addressing (Local = this port, Remote = the peer)
	"LocalTSelector" : "<HEX>",   "RemoteTSelector" : "<HEX>",
	"LocalSSelector" : "<HEX>",   "RemoteSSelector" : "<HEX>",
	"LocalPSelector" : "<HEX>",   "RemotePSelector" : "<HEX>",
	"LocalAPTitle" : "<OID>",     "LocalAEQualifier" : 0,
	"RemoteAPTitle" : "<OID>",    "RemoteAEQualifier" : 0,

	// ---- TASE.2
	"TASE2Edition" : "2000-08",
	"BilateralTableID" : "<OUR_BILATERAL_TABLE_ID>",
	"RemoteBilateralTableID" : "<THEIR_BILATERAL_TABLE_ID>",
	"LocalDomain" : "<OUR_DOMAIN_NAME>",         // the domain of the points this port serves
	"RemoteDomain" : "<THEIR_DOMAIN_NAME>",      // the domain of the points this port reads

	// ---- points. A Peer must give every point a Direction:
	//   "Serve": the value comes from ODC events (Event()) and is served to the peer; the domain defaults to LocalDomain
	//   "Read":  the value is read from the peer and published to ODC events; the domain defaults to RemoteDomain
	// An ODC index is used once per kind and direction: Serve index 0 and Read index 0 are different points (ODC inputs vs outputs). Giving the
	// Read points a separate index range (here 100 and up) keeps them apart when one ODC port feeds the peer and receives its values.
	"Analogs" : [{"Index" : 0,   "Name" : "<OUR_POINT_NAME>",   "Type" : "RealQ", "Direction" : "Serve"},
		{"Index" : 100, "Name" : "<THEIR_POINT_NAME>", "Type" : "RealQ", "Direction" : "Read", "ScaleFactor" : 1.0, "Offset" : 0.0}],
	"Binaries" : [{"Index" : 0,   "Name" : "<OUR_POINT_NAME>",   "Type" : "StateQ", "Direction" : "Serve"},
		{"Index" : 100, "Name" : "<THEIR_POINT_NAME>", "Type" : "StateQ", "Direction" : "Read"}],

	// ---- data sets: the direction follows the members (all "Read" = defined on the peer and read; all "Serve" = held by this port)
	"DataSets" : [{"Name" : "<DATA_SET_NAME_ON_THE_PEER>", "Members" : ["<THEIR_POINT_NAME>"]}],

	// ---- transfer sets this port STARTS on the peer (for its "Read" data sets), and the pool it OFFERS to the peer
	"TransferSets" : [{"DataSet" : "<DATA_SET_NAME_ON_THE_PEER>", "Conditions" : ["ObjectChange", "IntegrityTimeOut"], "IntegrityCheck" : 60}],
	"TransferSetPool" : ["<TRANSFER_SET_NAME_1>", "<TRANSFER_SET_NAME_2>"],

	// ---- control devices (TASE.2 Block 5, device control): "Serve" = a device of this port that the peer operates (published to ODC as a control
	// event with this Index); "Operate" = a device of the peer that this port operates from ODC control events with this Index. A Peer must give the
	// Direction. Block 5 is advertised / required automatically (or put 5 in "SupportedBlocks" / "RequiredRemoteBlocks" when you list them).
	"BinaryControls" : [{"Index" : 0,   "Name" : "<OUR_DEVICE_NAME>",   "Direction" : "Serve", "SelectRequired" : true},
		{"Index" : 100, "Name" : "<THEIR_DEVICE_NAME>", "Direction" : "Operate", "SelectRequired" : true}],
	"AnalogControls" : [{"Index" : 0,   "Name" : "<OUR_SETPOINT_NAME>",   "Type" : "RealSetpoint", "Direction" : "Serve"},
		{"Index" : 100, "Name" : "<THEIR_SETPOINT_NAME>", "Type" : "RealSetpoint", "Direction" : "Operate", "ScaleFactor" : 1.0, "Offset" : 0.0}]
}
