{
	// ICCP server port TEMPLATE. Replace every <PLACEHOLDER>; remove options you do not need. See ../../../Code/Ports/ICCPPort/README.md.
	// Not loadable until the placeholders are replaced.
	// "ServiceRole" (Client, Server or Peer) is independent of the port type; ICCPServer defaults to "Server". Add "Direction": "Serve" to a point
	// only if you set ServiceRole "Peer" (then every point must say "Serve" or "Read"). See ICCPPeer.template.conf for a Peer.
	"IP" : "0.0.0.0",                            // the address to listen on
	"Port" : "102",

	// ---- addressing: hexadecimal selectors, dotted-OID AP-titles. "Local" is this server, "Remote" the client.
	"LocalTSelector" : "<HEX>",   "RemoteTSelector" : "<HEX>",
	"LocalSSelector" : "<HEX>",   "RemoteSSelector" : "<HEX>",
	"LocalPSelector" : "<HEX>",   "RemotePSelector" : "<HEX>",
	"LocalAPTitle" : "<OID>",     "LocalAEQualifier" : 0,
	"RemoteAPTitle" : "<OID>",    "RemoteAEQualifier" : 0,
	"TPDUSize" : 1024,

	// ---- TASE.2
	"TASE2Edition" : "2000-08",                  // or "1996-08"
	"BilateralTableID" : "<OUR_BILATERAL_TABLE_ID>",         // reported to the client
	"RemoteBilateralTableID" : "<THEIR_BILATERAL_TABLE_ID>", // checked if the client reports one
	"AbortOnBilateralTableMismatch" : false,
	"LocalDomain" : "<OUR_DOMAIN_NAME>",         // the ICC domain the points below live in
	"RemoteDomain" : "<THEIR_DOMAIN_NAME>",
	"SupportedBlocks" : [1, 2, 5],               // 5 = device control (needed when this server owns controls; remove it if it has none)
	"VendorName" : "opendatacon", "ModelName" : "ICCP", "Revision" : "1.0",

	// ---- limits for what a client can create
	"MaxClientDataSets" : 16,
	"MaxDataSetMembers" : 5000,
	"NamePageSize" : 200,
	"MaxBufferedChanges" : 1000,
	"ReportAckTimeoutms" : 10000,                // critical transfer sets: how long a Transfer_Report_ACK may take before it is logged and counted as a Data_failure (0 = never)
	"MaxUnacknowledgedReports" : 100,            // critical transfer sets: reports waiting for an acknowledgement, per transfer set

	// ---- points. Index is the ODC index; Type must be given (see the client template).
	"Binaries" : [{"Index" : 0, "Name" : "<POINT_NAME>", "Type" : "StateQ", "Scope" : "ICC"}],
	"Analogs"  : [{"Index" : 0, "Name" : "<POINT_NAME>", "Type" : "RealQ", "ScaleFactor" : 1.0, "Offset" : 0.0}],
	"Counters" : [{"Index" : 0, "Name" : "<POINT_NAME>", "Type" : "DiscreteQ"}],

	// ---- the pool of transfer sets offered to the client
	"TransferSetPool" : ["<TRANSFER_SET_NAME_1>", "<TRANSFER_SET_NAME_2>"],

	// ---- control devices this server owns (TASE.2 Block 5): the peer operates them and each operate is published to ODC as a control event.
	// BinaryControls: ODC ControlRelayOutputBlock events (Type Command or DiscreteCommand); AnalogControls: ODC AnalogOutput events
	// (Type RealSetpoint or DiscreteSetpoint, "AnalogOutputType" Int16, Int32, Float32 or Double64 selects the ODC event type published).
	// "SelectRequired" true: the peer must select the device first (a Read of its select object arms it for "SelectTimeoutms"); the select returns "CheckBackID"
	// (default 1), the value the bilateral table has for the device.
	"BinaryControls" : [{"Index" : 0, "Name" : "<DEVICE_NAME>", "Type" : "Command", "SelectRequired" : true, "SelectTimeoutms" : 10000, "CheckBackID" : 1,
			"Timeoutms" : 4000, "CommandValueOn" : 1, "CommandValueOff" : 0, "ControlCodeOn" : "LATCH_ON", "ControlCodeOff" : "LATCH_OFF"}],
	"AnalogControls" : [{"Index" : 0, "Name" : "<DEVICE_NAME>", "Type" : "RealSetpoint", "ScaleFactor" : 1.0, "Offset" : 0.0, "AnalogOutputType" : "Double64"}]
}
