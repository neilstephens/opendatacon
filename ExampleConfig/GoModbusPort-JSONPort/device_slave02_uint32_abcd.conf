{
	// Slave 2 — unsigned 32-bit integer, byte order A B C D
	// Holding Registers (HR): address range 1,3,5,…,1023 (two consecutive registers per value, 4 bytes)
	// The server stores one UINT32 across registers [N, N+1] where N is odd.

	"TCP": {
		"Address": "45.8.248.56:502"
	},
	"UnitID": 2,
	"TimeoutMs": 5000,
	"PollRateMs": 1000,

	// Three 32-bit analog values from HR addresses 1,3,5 (each uses 2 registers, Count=2)
	"Analogs": [
		{ "Index": 1200, "Modbus": { "Type": "HoldingRegister", "Address": 1, "Count": 2 },
		  "Endian": "ABCD", "DataType": "Uint32", "Scale": 1.0, "Offset": 0.0, "PollRateMs": 2000 },
		{ "Index": 1201, "Modbus": { "Type": "HoldingRegister", "Address": 3, "Count": 2 },
		  "Endian": "ABCD", "DataType": "Uint32", "Scale": 1.0, "Offset": 0.0, "PollRateMs": 2000 },
		{ "Index": 1202, "Modbus": { "Type": "HoldingRegister", "Address": 5, "Count": 2 },
		  "Endian": "ABCD", "DataType": "Uint32", "Scale": 1.0, "Offset": 0.0, "PollRateMs": 2000 }
	],

	// HR 200 writable as 32-bit analog output
	"AnalogControls": [
		{ "Index": 0, "Modbus": { "Type": "HoldingRegister", "Address": 200, "Count": 2 },
		  "ControlType": "AnalogOutputInt32", "PollRateMs": 0 }
	],

	"AnalogOutputStatuses": [
		{ "Index": 0, "Modbus": { "Type": "HoldingRegister", "Address": 200, "Count": 2 },
		  "Endian": "ABCD", "DataType": "Uint32", "PollRateMs": 0 }
	]
}
